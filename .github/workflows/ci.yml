name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  go:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: go
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test ./...

  web-client:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # The client is plain ES modules without a build step: a syntax error shows only on the phone otherwise
      # (as .mjs: the app's scripts are ES modules)
      - run: |
          for f in go/web/static/*.js; do
            cp "$f" "$RUNNER_TEMP/$(basename "$f" .js).mjs" && node --check "$RUNNER_TEMP/$(basename "$f" .js).mjs" || exit 1
          done

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t infomaster .
