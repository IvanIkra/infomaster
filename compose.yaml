# Production run on the Tablo host: docker compose up -d --build
# No port is published on the host (§3). The Mini App goes out only through the Tailscale sidecar's Funnel;
# Tablo reaches the internal port by service name over the shared network.
# Bridge network with explicit DNS, as Tablo: the host's routing sends container traffic into AmneziaWG.
services:
  infomaster:
    build: .
    image: infomaster:latest
    container_name: infomaster
    restart: unless-stopped
    dns:
      - ${CONTAINER_DNS_1:?set CONTAINER_DNS_1 in .env}
      - ${CONTAINER_DNS_2:?set CONTAINER_DNS_2 in .env}
    env_file: .env
    environment:
      TZ: Europe/Moscow
    volumes:
      - ./data:/app/data
    networks: [uni]
    mem_limit: 256m
    logging:
      driver: json-file
      options:
        max-size: 5m
        max-file: "3"

  # Its own node in the personal tailnet, tagged, the only one allowed Funnel (р. 31). Userspace networking:
  # no tun device, no routes and no DNS changes in the host or in other containers.
  # A fixed address the host's awg-router leaves out of the AmneziaWG tunnel, as it does the host's own
  # tailscaled: DERP and Let's Encrypt die in the tunnel after two minutes (see TS_FORCE_NOISE_443 below).
  tailscale:
    image: tailscale/tailscale:stable
    container_name: infomaster-tailscale
    hostname: infomaster-tailscale  # not "infomaster": inside the sidecar that name would be itself, not the service
    restart: unless-stopped
    dns:
      - ${CONTAINER_DNS_1:?set CONTAINER_DNS_1 in .env}
      - ${CONTAINER_DNS_2:?set CONTAINER_DNS_2 in .env}
    environment:
      TS_AUTHKEY: ${TS_AUTHKEY:-}
      TS_HOSTNAME: infomaster
      TS_STATE_DIR: /var/lib/tailscale
      TS_USERSPACE: "true"
      TS_ACCEPT_DNS: "false"
      TS_SERVE_CONFIG: /config/serve.json
      # Control over 443 straight away, as the host's tailscaled ends up: on the direct path port 80 goes
      # through the ISP's proxy, and the long-poll to the control server dies after two minutes
      TS_FORCE_NOISE_443: "true"
    volumes:
      - ./data/tailscale:/var/lib/tailscale
      - ./tailscale:/config:ro
    networks:
      uni:
        ipv4_address: 172.30.77.10
    mem_limit: 128m
    logging:
      driver: json-file
      options:
        max-size: 5m
        max-file: "3"

networks:
  uni:
    name: infomaster  # Tablo joins it as an external network when it switches to us (stage 10)
    ipam:
      config:
        - subnet: 172.30.77.0/24
          ip_range: 172.30.77.128/25  # dynamic addresses, away from the sidecar's
