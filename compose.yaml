# Production run on the Tablo host: scripts/deploy.sh (compiles elsewhere: building here needs ~2 GB of memory);
# on a host with the memory, docker compose up -d --build
# No port is published on the host (§3). The public port goes out only through the Tailscale sidecar's Funnel;
# Tablo reaches the internal port by service name over the shared network.
# Bridge network with explicit DNS, as Tablo: the host's routing sends container traffic into AmneziaWG.
services:
  infomaster:
    build:
      context: .
      args:
        APP_UID: ${APP_UID:-1000}  # the host user that owns ./data (D79): the service runs as it, not as root
    image: infomaster:latest
    container_name: infomaster
    restart: unless-stopped
    dns:
      - ${CONTAINER_DNS_1:?set CONTAINER_DNS_1 in .env}
      - ${CONTAINER_DNS_2:?set CONTAINER_DNS_2 in .env}
    env_file: .env
    environment:
      TZ: Europe/Moscow
      TS_AUTHKEY: ""  # the sidecar's key to the tailnet: not this service's to hold
      TEX_URL: http://texbuild:8090  # the TeX builder below (D84); a tool says so while it is not running
    volumes:
      - ./data:/app/data
    networks: [uni, tex]
    mem_limit: 256m
    logging:
      driver: json-file
      options:
        max-size: 5m
        max-file: "3"

  # Its own node in the personal tailnet, tagged, the only one allowed Funnel (D31). Userspace networking:
  # no tun device, no routes and no DNS changes in the host or in other containers.
  # A fixed address the host's awg-router leaves out of the AmneziaWG tunnel, as it does the host's own
  # tailscaled: DERP and Let's Encrypt die in the tunnel after two minutes (see TS_FORCE_NOISE_443 below).
  tailscale:
    image: tailscale/tailscale:stable
    container_name: infomaster-tailscale
    hostname: infomaster-tailscale  # not "infomaster": inside the sidecar that name would be itself, not the service
    restart: unless-stopped
    dns:
      - ${CONTAINER_DNS_1:?set CONTAINER_DNS_1 in .env}
      - ${CONTAINER_DNS_2:?set CONTAINER_DNS_2 in .env}
    environment:
      TS_AUTHKEY: ${TS_AUTHKEY:-}
      TS_HOSTNAME: infomaster
      TS_STATE_DIR: /var/lib/tailscale
      TS_USERSPACE: "true"
      TS_ACCEPT_DNS: "false"
      TS_SERVE_CONFIG: /config/serve.json
      # Control over 443 straight away, as the host's tailscaled ends up: on the direct path port 80 goes
      # through the ISP's proxy, and the long-poll to the control server dies after two minutes
      TS_FORCE_NOISE_443: "true"
    volumes:
      - ./data/tailscale:/var/lib/tailscale
      - ./tailscale:/config:ro
    networks:
      uni:
        ipv4_address: 172.30.77.10
    mem_limit: 128m
    logging:
      driver: json-file
      options:
        max-size: 5m
        max-file: "3"

  # The TeX builder of the knowledge base (D84): scripts/tex-image.sh builds its image and starts it, deploy.sh does
  # not. It holds nothing: no data, no secrets, no way out of its internal network, a read-only root, one CPU.
  texbuild:
    image: infomaster-tex:latest
    pull_policy: never
    container_name: infomaster-texbuild
    restart: unless-stopped
    networks: [tex]
    read_only: true
    tmpfs:
      - /work:size=256m,mode=1777
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 512m
    cpus: 1
    pids_limit: 64
    logging:
      driver: json-file
      options:
        max-size: 1m
        max-file: "2"

networks:
  tex:
    name: infomaster-tex
    internal: true  # the builder and the service only, no way out
  uni:
    name: infomaster  # Tablo joins it as an external network when it switches to us (stage 10)
    ipam:
      config:
        - subnet: 172.30.77.0/24
          ip_range: 172.30.77.128/25  # dynamic addresses, away from the sidecar's
