    // --- HSE App X ------------------------------------------------------------------------------

    // Login links are made ahead: Telegram opens a link only right in a tap, not after a request. Each link holds
    // a PKCE state and the service keeps the last five, so links are made on opening the screen and after a tap,
    // never while the screen waits for the login to come back.
    const hse = {link: null, appLink: null, watch: null, note: null, fallback: false, pasted: "", busy: false,
                 failed: false};
    const LOGIN_ERROR = "login needed: ";  // the status error when the session ended (collectors/hseapp.py)
    const loggedIn = () => L("Logged in. The deadlines will be updated within a minute.",
                             "Вход выполнен. Дедлайны обновятся в течение минуты.");

    async function hseLink(app) {
      return (await send("api/hseapp/link", "POST", {app})).url;
    }

    // The link back to the service always, the one with the app's address once its section is open.
    async function prepareHseLinks() {
      if (hse.busy) return;
      hse.busy = true;
      try {
        if (!hse.link) hse.link = await hseLink(false);
        if (hse.fallback && !hse.appLink) hse.appLink = await hseLink(true);
      } catch (error) {
        hse.note = {ok: false, text: error.message};
        hse.failed = true;
      }
      hse.busy = false;
      if (nav.stack.at(-1) === hsePage) redraw();
    }

    function stopHseWatch() {
      clearInterval(hse.watch);
      hse.watch = null;
    }

    // After a tap on a login link: the state every 3 s until the login is back from the browser, 5 minutes at most.
    function watchHseLogin() {
      stopHseWatch();
      const started = Date.now();
      hse.watch = setInterval(async () => {
        if (Date.now() - started > 5 * 60 * 1000 || nav.stack.at(-1) !== hsePage) return stopHseWatch();
        try {
          const before = await get("api/hseapp");
          const state = await call("api/hseapp");
          const changed = JSON.stringify(state) !== JSON.stringify(before);
          if (state.status.logged_in && changed) {
            stopHseWatch();
            if (!before.status.logged_in) hse.note = {ok: true, text: loggedIn()};
          }
          if (changed) {  // not on every tick: a half-pasted address must stay
            cache["api/hseapp"] = Promise.resolve(state);
            redraw();
          }
        } catch (error) {
          stopHseWatch();
        }
      }, 3000);
    }

    function openHseLink(app) {
      tg.openLink(app ? hse.appLink : hse.link);
      if (app) hse.appLink = null; else hse.link = null;  // used: a fresh one for the next tap
      hse.note = {ok: true, text: L("The login is open in the browser. Come back here after it: the screen updates "
        + "by itself.", "Вход открыт в браузере. После него вернитесь сюда: экран обновится сам.")};
      watchHseLogin();
      prepareHseLinks();
    }

    async function hsePage() {
      const state = await get("api/hseapp");
      const s = state.status;
      if (s.enabled && !hse.failed && (!hse.link || (hse.fallback && !hse.appLink))) setTimeout(prepareHseLinks);
      const ended = (s.error || "").startsWith(LOGIN_ERROR);  // Keycloak ended the session
      const parts = [el("h1", {className: "title"}, "HSE App X"),
        el("p", {className: "subtitle"}, L("Deadlines from the HSE app.", "Дедлайны из приложения ВШЭ."))];
      if (s.enabled && !s.logged_in) {
        parts.push(notice((ended ? L(`The login is no longer valid (${s.error.slice(LOGIN_ERROR.length)})`,
          `Вход больше не действует (${s.error.slice(LOGIN_ERROR.length)})`) : L("A login is needed", "Нужен вход"))
          + L(": the deadlines are not updated", ": дедлайны не обновляются")
          + (s.items || s.done ? L(", the list has the last ones received.", ", в списке последнее полученное.") : ".")));
      }
      if (s.error && s.enabled && !ended) parts.push(notice(L("The last error: ", "Последняя ошибка: ") + s.error));
      if (s.labels_error) {
        parts.push(notice(L("The English titles wait for Haiku: ", "Английские названия ждут Haiku: ") + s.labels_error));
      }
      parts.push(section(null, [row({title: L("Poll HSE App X", "Опрашивать HSE App X"),
        control: toggle(s.enabled, async (on) => {
          hse.note = null;
          await act("api/hseapp", "PATCH", {enabled: on});
        })})], L("One client per login: HSE App X must be off in Tablo.",
        "Только один клиент на вход: в Tablo HSE App X должен быть выключен.")));
      if (s.enabled && s.logged_in) {
        parts.push(section(L("State", "Состояние"), [
          row({title: L("Active deadlines", "Активные дедлайны"), value: String(s.items)}),
          row({title: L("Done", "Выполненные"), value: String(s.done)}),
          row({title: L("Updated", "Обновлено"), value: s.ok_at ? when(s.ok_at) : L("soon", "вот-вот")})]));
      }
      if (s.enabled) {
        parts.push(el("div", {className: "list", style: "margin-top: 22px"},
          button(s.logged_in ? L("Log in again", "Войти заново") : L("Log in", "Войти"), () => openHseLink(false),
            {disabled: !hse.link})));
        parts.push(el("p", {className: "foot" + (hse.note && !hse.note.ok ? " warn" : "")}, hse.note ? hse.note.text
          : L("Once is enough: after that the service renews the login itself every 15 minutes.",
            "Достаточно одного раза: дальше сервис сам продлевает вход раз в 15 минут.")));
        parts.push(hseFallback(state));
      }
      return parts;
    }

    function hseFallback(state) {
      const head = row({title: L("The browser did not come back", "Браузер не вернулся"), go: () => {
        hse.fallback = !hse.fallback;
        if (hse.fallback) prepareHseLinks();
        redraw();
      }});
      if (!hse.fallback) return el("div", {className: "list", style: "margin-top: 22px"}, head);
      const pasted = el("textarea", {rows: 3, value: hse.pasted, autocomplete: "off", spellcheck: false,
        placeholder: "https://…/hseapp/callback?state=…&code=…"});
      pasted.oninput = () => { hse.pasted = pasted.value; };
      return [el("div", {className: "list", style: "margin-top: 22px"}, head,
        button(L("Log in with the app's address", "Войти с адресом приложения"), () => openHseLink(true),
          {disabled: !hse.appLink}),
        el("div", {className: "row"}, pasted),
        button(L("Save the login", "Сохранить вход"), async () => {
          try {
            cache["api/hseapp"] = Promise.resolve(await send("api/hseapp/login", "POST", {url: hse.pasted}));
            hse.note = {ok: true, text: loggedIn()};
            hse.pasted = "";
            hse.fallback = false;
            stopHseWatch();
          } catch (error) {
            hse.note = {ok: false, text: error.message};
          }
          redraw();
        })),
      el("p", {className: "foot"}, L(`After the login the browser comes back to ${state.callback} by itself. If that `
        + "page did not open, copy its whole address (it has code= in it) and paste it above within a minute. If HSE "
        + "does not let you in, log in with the app's address: the browser cannot open ru.hse.hseappx://…, and that "
        + "address is the one to copy (Safari loses it, Chrome is needed).", `После входа браузер сам возвращается на `
        + `${state.callback}. Если эта страница не открылась, скопируйте её адрес целиком (в нём есть code=) и вставьте `
        + "выше в течение минуты. Если ВШЭ не пускает, войдите с адресом приложения: браузер не сможет открыть "
        + "ru.hse.hseappx://… — этот адрес и нужно скопировать (Safari его теряет, нужен Chrome)."))];
    }

    // --- grades: the name and the sheets ---------------------------------------------------------

    const draft = {url: "", label: ""};  // the sheet being added: kept across redraws

    function rereadGrades() {
      setTimeout(() => {
        if (nav.stack.at(-1) === gradesSettingsPage || (nav.tab === "study" && !nav.stack.length)) {
          delete cache["api/grades"];

          + `${data.label_chars} символов (пусто — начало названия таблицы). Первое чтение — снимок, без сообщений.`))];

          sub: `${subject.title} · ${subject.abbr}`, value: subject.manual ? L("manual", "вручную") : "Haiku",

          ? L("Nothing found.", "Ничего не нашлось.") : L("The dictionary is empty: courses come from RUZ and from the "

    function subjectPage(subject, dictionary) {
      const fresh = !subject;
      subject = subject || {name: "", title: "", abbr: "", manual: true};
      const name = el("input", {className: "grow", value: subject.name, readOnly: !fresh, placeholder: "Математический анализ"});

      const label = (text) => el("span", {style: "color: var(--hint); width: 92px; flex: none"}, text);
      const field = (text, input) => el("div", {className: "row"}, label(text), input);
      return [el("h1", {className: "title"}, fresh ? L("New entry", "Новая запись") : subject.name),
        section(null, [field(L("Source", "Источник"), name), field(L("Title", "Название"), title),
          field(L("Short", "Кратко"), abbr)],
          L(`The source's name; the English title for the timetable (Tablo fits ${dictionary.title_chars}); the `
            + `abbreviation for deadlines, up to ${dictionary.abbr_chars} characters.`, `Название как у источника; `
            + `английское — для расписания (в Tablo влезает ${dictionary.title_chars}); сокращение — для дедлайнов, до `
            + `${dictionary.abbr_chars} символов.`) + " " + (subject.manual ? L("The entry is set by hand.",
            "Запись задана вручную.") : L("Now it is Haiku's answer; saved, it becomes manual.",
            "Сейчас это ответ Haiku; после сохранения станет ручной."))),
        primary(L("Save", "Сохранить"), async () => {
          try {
            await send("api/subjects", "PUT", {name: name.value, title: title.value, abbr: abbr.value});
            back();
          } catch (error) {
            tell(error.message);
          }
        }),
        fresh ? null : el("div", {className: "list", style: "margin-top: 24px"}, button(subject.manual
          ? L("Delete the entry", "Удалить запись") : L("Delete Haiku's answer", "Удалить ответ Haiku"), async () => {
          if (!await askYes(L("Delete it? Haiku names the course again.", "Удалить? Haiku назовёт курс заново."))) return;
          try {
            await send("api/subjects", "DELETE", {name: subject.name});
            back();
          } catch (error) {
            tell(error.message);
          }
        }, {danger: true}))];
    }

    // --- LLM spending ---------------------------------------------------------------------------------

    const TASKS = () => L({batch: "Batch parsing", image: "Images", pdf: "Whole PDF", summary: "Summaries",
                           subjects: "Dictionary", grades: "Grades", hseapp_labels: "HSE App X labels"},
                          {batch: "Разбор пачек", image: "Картинки", pdf: "PDF целиком", summary: "Сводки",
                           subjects: "Словарь", grades: "Оценки", hseapp_labels: "Метки HSE App X"});
    const PERIODS = () => [["today", L("Today", "Сегодня")], ["week", L("Week", "Неделя")],
                           ["month", L("Month", "Месяц")]];
    const PRICE_FIELDS = () => [["input", L("Input", "Вход")], ["output", L("Output", "Выход")],
                                ["long_input", L("Input > 100K", "Вход > 100K")],
                                ["long_output", L("Output > 100K", "Выход > 100K")]];
    const llmView = {period: "today", day: null};
    const SVG = "http://www.w3.org/2000/svg";

    function svg(tag, attrs) {
      const node = document.createElementNS(SVG, tag);
      for (const [key, value] of Object.entries(attrs)) node.setAttribute(key, value);
      return node;
    }

    function chart(data) {
      const width = 300, height = 120, top = 8, bottom = 16, step = width / data.days.length;
      const peak = Math.max(data.daily_limit_usd, ...data.days.map((d) => d.cost_usd)) * 1.1;
      const y = (value) => top + (height - top - bottom) * (1 - value / peak);
      const picture = svg("svg", {viewBox: `0 0 ${width} ${height}`, class: "chart", preserveAspectRatio: "none"});
      const last = data.days.length - 1;
      data.days.forEach((day, i) => {
        const classes = ["bar", i === last ? "today" : "", day.stopped ? "stopped" : "",
                         day.day === llmView.day ? "picked" : ""].filter(Boolean).join(" ");
        const bar = Math.max(day.cost_usd ? 1.5 : 0, y(0) - y(day.cost_usd));
        picture.append(svg("rect", {class: classes, x: i * step + 1, y: y(0) - bar, width: step - 2, height: bar,
                                    rx: 1.5}));
        const tap = svg("rect", {class: "tap", x: i * step, y: 0, width: step, height});
        tap.onclick = () => { llmView.day = llmView.day === day.day ? null : day.day; redraw(); };
        picture.append(tap);
      });
      picture.append(svg("line", {class: "limit", x1: 0, x2: width, y1: y(data.daily_limit_usd),
                                  y2: y(data.daily_limit_usd)}));
      for (const i of [0, Math.floor(last / 2), last]) {
        const label = svg("text", {x: i * step + step / 2, y: height - 3, "font-size": 9, fill: "currentColor",
                                   opacity: .5, "text-anchor": i === 0 ? "start" : i === last ? "end" : "middle"});
        label.textContent = i === last ? L("today", "сегодня")
          : data.days[i].day.slice(8, 10) + "." + data.days[i].day.slice(5, 7);
        picture.append(label);
      }
      return picture;
    }

    function costRow(title, sub, cost, total) {
      const share = total ? Math.round(cost / total * 100) : 0;
      return row({title, sub: el("div", {}, sub, el("div", {className: "meter"}, el("i", {style: `width: ${share}%`}))),
        control: el("div", {className: "money"}, usd(cost), el("div", {className: "sub"}, share + " %"))});
    }

    async function llmPage() {
      const [data, general] = await Promise.all([get("api/llm"), maybe("api/general")]);
      const period = data.periods[llmView.period];
      const parts = [el("h1", {className: "title"}, L("LLM spending", "Расход LLM"))];
      if (data.level !== "ok") {
        parts.push(notice(data.level === "hard"
          ? L("Today's limit is spent: calls wait until midnight, messages wait in the queue.",
            "Лимит на сегодня исчерпан: вызовы стоят до полуночи, сообщения ждут в очереди.")
          : L("Over 80 % of the limit: images, whole PDFs and the daily summary are off until midnight.",
            "Больше 80 % лимита: картинки, PDF целиком и ежедневная сводка отключены до полуночи.")));
      }
      const share = Math.round(data.spent_usd / data.limit_usd * 100);
      const notes = {today: L(`${share} % of the limit`, `${share} % лимита`), week: runs(data.periods.week.runs),
                     month: L("forecast ", "прогноз ") + usd(data.month_forecast_usd)};
      parts.push(el("div", {className: "periods"}, ...PERIODS().map(([name, title]) => {
        const b = el("button", {className: name === llmView.period ? "on" : ""}, el("div", {className: "label"}, title),
          el("div", {className: "sum"}, usd(data.periods[name].cost_usd)), el("div", {className: "note"}, notes[name]));
        b.onclick = () => { haptic(); llmView.period = name; redraw(); };
        return b;
      })));
      const day = data.days.find((d) => d.day === llmView.day);
      parts.push(el("h3", {}, L(`${data.days.length} days`, `${data.days.length} дней`)),
        el("div", {className: "list chart-box"}, chart(data), el("div", {className: "sub"}, day
          ? `${dayLabel(day.day)}: ${usd(day.cost_usd)}, ${runs(day.runs)}`
            + (day.failed ? L(`, failed ${day.failed}`, `, неудачных ${day.failed}`) : "")
            + (day.stopped ? L(", the limit was spent", ", лимит исчерпан") : "")
          : L(`Dashes: the limit, ${usd(data.daily_limit_usd)} a day. Tap a bar.`,
            `Пунктир — лимит ${usd(data.daily_limit_usd)} в день. Нажмите на столбик.`))));
      const title = PERIODS().find(([name]) => name === llmView.period)[1].toLowerCase();
      if (!period.runs) {
        parts.push(el("h3", {}, L("By task · ", "По задачам · ") + title), empty(L("No calls.", "Вызовов не было.")));
      } else {
        parts.push(section(L("By task · ", "По задачам · ") + title, period.by_task.map((r) => costRow(TASKS()[r.task] || r.task,
          runs(r.runs) + (r.failed ? L(`, failed ${r.failed}`, `, неудачных ${r.failed}`) : ""), r.cost_usd,
          period.cost_usd))));
        const chatted = period.by_chat.reduce((sum, r) => sum + r.cost_usd, 0);
        const rows = period.by_chat.map((r) => costRow(r.title, runs(r.runs), r.cost_usd, period.cost_usd));
        if (period.cost_usd - chatted > 0.0005) {
          rows.push(costRow(L("No chat", "Без чата"), L("dictionary, grades, HSE App X labels",
            "словарь, оценки, метки HSE App X"), period.cost_usd - chatted, period.cost_usd));
        }
        parts.push(section(L("By chat · ", "По чатам · ") + title, rows));
      }
      const raised = usd(data.limit_usd + data.daily_limit_usd);
      parts.push(section(L("Limit", "Лимит"), [
        row({title: L("A day, $", "В день, $"), control: numberInput(data.daily_limit_usd, {min: 0.05, step: 0.05},
          (value) => act("api/llm", "PATCH", {daily_limit_usd: value}))}),
        button(L(`Raise today's limit to ${raised}`, `Поднять лимит на сегодня до ${raised}`), async () => {
          if (await askYes(L(`Raise today's limit to ${raised}? Until midnight.`,
            `Поднять лимит на сегодня до ${raised}? До полуночи.`))) act("api/llm/raise", "POST", {}, "api/llm");
        })], L("Every call of Haiku, the failed ones too; a day is Moscow's. Above 80 % of the limit images, whole PDFs "
        + "and the daily summary are off; at 100 % calls wait until midnight.", "Все вызовы Haiku, неудачные тоже; сутки "
        + "— по Москве. Выше 80 % лимита отключаются картинки, PDF целиком и ежедневная сводка; на 100 % вызовы стоят "
        + "до полуночи.") + (data.raised_usd ? " " + L(`Raised by ${usd(data.raised_usd)} today already.`,
        `Сегодня уже поднят на ${usd(data.raised_usd)}.`) : "")));
      if (general) {
        for (const [model, price] of Object.entries(general.llm_prices)) {
          parts.push(section(L(`${model} · $ per 1M tokens`, `${model} · $ за 1 млн токенов`), PRICE_FIELDS().map(([key, name]) =>
            row({title: name, control: numberInput(price[key], {min: 0, step: 0.01}, (value) => act("api/general",
              "PATCH", {llm_prices: {...general.llm_prices, [model]: {...price, [key]: value}}}))}))));
        }
      }
      return parts;
    }

    // --- start -----------------------------------------------------------------------------------------

    const ROOTS = {deadlines: deadlinesPage, schedule: schedulePage, study: studyPage, settings: settingsPage};
    // The screens a link may ask for (a button under a post in the forum): the tab, then what to open in it.
    const SCREENS = {chats: ["settings", chatsPage], schedule: ["schedule"], deadlines: ["deadlines"],
                     sheets: ["study", "sheets"], grades: ["study", "grades"], summaries: ["settings", summariesPage],
                     subjects: ["settings", subjectsPage], hseapp: ["settings", hsePage], llm: ["settings", llmPage],
                     general: ["settings", generalPage], settings: ["settings"]};
    const startScreen = new URLSearchParams(location.search).get("screen") || tg.initDataUnsafe.start_param;

    tg.BackButton.onClick(() => card ? closeCard() : back());

    // The first screen, again after the Mini App's language changed.
    async function start(screen) {
      try {
        me = await call("api/me");
      } catch (error) {
        $("screen").replaceChildren(empty(error.message));
        return;
      }
      lang = me.language;
      document.documentElement.lang = lang;
      drawTabbar();
      const [tab, inner] = SCREENS[screen] || ["deadlines"];
      nav.tab = tab;
      nav.stack = typeof inner === "function" ? [inner] : [];
      if (typeof inner === "string") nav.study = inner;
      draw(true);
    }

    start(startScreen);
  </script>
</body>
</html>
