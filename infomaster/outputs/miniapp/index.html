<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>infomaster</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    /* Telegram's theme (--tg-theme-*), dark first; the fallbacks are for a browser outside Telegram. */
    :root {
      --bg: var(--tg-theme-secondary-bg-color, #000);
      --surface: var(--tg-theme-section-bg-color, var(--tg-theme-bg-color, #1c1c1e));
      --text: var(--tg-theme-text-color, #fff);
      --hint: var(--tg-theme-hint-color, #8d8d93);
      --accent: var(--tg-theme-button-color, #3e88f7);
      --on-accent: var(--tg-theme-button-text-color, #fff);
      --link: var(--tg-theme-link-color, #3e88f7);
      --header: var(--tg-theme-section-header-text-color, #8d8d93);
      --danger: var(--tg-theme-destructive-text-color, #eb5545);
      --sep: var(--tg-theme-section-separator-color, #38383a);
      --press: rgba(128, 128, 128, .14);
      --field: rgba(128, 128, 128, .16);
    }
    @media (prefers-color-scheme: light) {
      :root {
        --bg: var(--tg-theme-secondary-bg-color, #f2f2f7);
        --surface: var(--tg-theme-section-bg-color, var(--tg-theme-bg-color, #fff));
        --text: var(--tg-theme-text-color, #000);
        --hint: var(--tg-theme-hint-color, #8a8a8e);
        --accent: var(--tg-theme-button-color, #2481cc);
        --link: var(--tg-theme-link-color, #2481cc);
        --header: var(--tg-theme-section-header-text-color, #6d6d72);
        --danger: var(--tg-theme-destructive-text-color, #e53935);
        --sep: var(--tg-theme-section-separator-color, #d1d1d6);
      }
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { background: var(--bg); }
    body {
      max-width: 640px;
      margin: 0 auto;
      padding: 0 16px calc(96px + env(safe-area-inset-bottom));
      font: 17px/1.3 -apple-system, BlinkMacSystemFont, "SF Pro Text", Roboto, system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
      color: var(--text);
    }
    body.inner { padding-bottom: calc(32px + env(safe-area-inset-bottom)); }
    input, select, textarea, button { font: inherit; color: inherit; }
    a { color: var(--link); text-decoration: none; }
    [hidden] { display: none !important; }

    /* --- titles ------------------------------------------------------------- */

    .large { margin: 0; padding: 22px 4px 2px; font-size: 32px; font-weight: 700; letter-spacing: -.02em; }
    .title { margin: 0; padding: 18px 4px 2px; font-size: 22px; font-weight: 600; letter-spacing: -.01em;
             overflow-wrap: anywhere; }
    .subtitle { margin: 0 4px 6px; color: var(--hint); font-size: 15px; }
    h3 {
      margin: 26px 16px 7px;
      font-size: 13px;
      font-weight: 400;
      text-transform: uppercase;
      letter-spacing: .02em;
      color: var(--header);
    }
    .foot { margin: 7px 16px 0; color: var(--hint); font-size: 13px; line-height: 1.38; }
    .empty { padding: 40px 24px; text-align: center; color: var(--hint); font-size: 15px; line-height: 1.4; }

    /* --- lists -------------------------------------------------------------- */

    .list { margin-top: 10px; overflow: hidden; border-radius: 12px; background: var(--surface); }
    h3 + .list { margin-top: 0; }
    .row {
      position: relative;
      display: flex;
      align-items: center;
      gap: 12px;
      min-height: 46px;
      padding: 10px 16px;
    }
    .row:not(:last-child)::after {
      content: "";
      position: absolute;
      right: 0;
      bottom: 0;
      left: 16px;
      height: 1px;
      background: var(--sep);
      transform: scaleY(.5);
      transform-origin: bottom;
    }
    .row.lead:not(:last-child)::after { left: 58px; }
    .row.tap { cursor: pointer; transition: background .15s; }
    .row.tap:active { background: var(--press); }
    .row .main { flex: 1; min-width: 0; }
    .row .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .row .name.wrap { white-space: normal; overflow-wrap: anywhere; }
    .row .sub { margin-top: 2px; color: var(--hint); font-size: 14px; line-height: 1.3; overflow-wrap: anywhere; }
    .row .value { flex: none; max-width: 50%; color: var(--hint); font-size: 16px; text-align: right;
                  overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .row .chev { flex: none; width: 8px; height: 13px; margin-left: -4px; color: var(--hint); opacity: .55; }
    .row.button { justify-content: center; color: var(--link); cursor: pointer; }
    .row.button.danger { color: var(--danger); }
    .row.button.left { justify-content: flex-start; }
    .row.button[aria-disabled=true] { opacity: .4; pointer-events: none; }
    .row.button .icon { width: 22px; height: 22px; }
    .late { color: var(--danger) !important; }
    .soon { color: var(--link) !important; }
    .warn { color: var(--danger); }
    .struck { text-decoration: line-through; }
    .faded { opacity: .45; }
    .badge {
      display: inline-block;
      margin-left: 6px;
      padding: 0 6px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 600;
      line-height: 18px;
      vertical-align: 2px;
      color: var(--on-accent);
      background: var(--accent);
    }

    /* A square icon at the start of a row, as in Telegram's settings. */
    .tile {
      flex: none;
      display: grid;
      place-items: center;
      width: 30px;
      height: 30px;
      border-radius: 8px;
      color: #fff;
      background: var(--c, #8e8e93);
    }
    .tile .icon { width: 19px; height: 19px; }
    .icon { display: inline-grid; flex: none; width: 24px; height: 24px; }
    .icon svg { width: 100%; height: 100%; fill: none; stroke: currentColor; stroke-width: 1.9;
                stroke-linecap: round; stroke-linejoin: round; }
    .dot { flex: none; width: 8px; height: 8px; border-radius: 50%; background: var(--danger); }

    /* Something to see to: a line in the colour of trouble on a card. */
    .notice { display: flex; gap: 10px; margin-top: 10px; padding: 12px 16px; border-radius: 12px;
              background: var(--surface); font-size: 15px; line-height: 1.35; }
    .notice .dot { margin-top: 6px; }
    .notice.tap { cursor: pointer; }
    .notice .main { flex: 1; min-width: 0; overflow-wrap: anywhere; }
    .notice .chev { flex: none; align-self: center; width: 8px; height: 13px; color: var(--hint); opacity: .55; }

    /* --- controls ----------------------------------------------------------- */

    .switch { position: relative; flex: none; width: 51px; height: 31px; cursor: pointer; }
    .switch input { position: absolute; opacity: 0; width: 0; height: 0; }
    .switch span { position: absolute; inset: 0; border-radius: 16px; background: var(--field); transition: background .2s; }
    .switch span::after {
      content: "";
      position: absolute;
      top: 2px;
      left: 2px;
      width: 27px;
      height: 27px;
      border-radius: 50%;
      background: #fff;
      box-shadow: 0 2px 6px rgba(0, 0, 0, .22);
      transition: transform .22s cubic-bezier(.3, 1.2, .5, 1);
    }
    .switch input:checked + span { background: var(--accent); }
    .switch input:checked + span::after { transform: translateX(20px); }

    select {
      flex: none;
      max-width: 55%;
      padding: 4px 18px 4px 0;
      border: 0;
      text-align: right;
      text-overflow: ellipsis;
      color: var(--hint);
      background: none;
      -webkit-appearance: none;
      appearance: none;
      cursor: pointer;
    }
    .select { position: relative; flex: none; display: flex; }
    .select::after {
      content: "";
      position: absolute;
      top: 50%;
      right: 2px;
      width: 7px;
      height: 7px;
      margin-top: -6px;
      border-right: 1.6px solid var(--hint);
      border-bottom: 1.6px solid var(--hint);
      transform: rotate(45deg);
      pointer-events: none;
    }
    .row input:not([type=checkbox]) {
      flex: none;
      width: 96px;
      padding: 4px 0;
      border: 0;
      text-align: right;
      color: var(--hint);
      background: none;
      outline: none;
    }
    .row input:focus { color: var(--text); }
    .row input.grow { flex: 1; width: auto; min-width: 0; text-align: left; color: var(--text); }
    .row input[type=date], .row input[type=time] { width: auto; min-height: 30px; }
    .row .name input { width: 100%; padding: 2px 0; text-align: left; color: var(--text); }
    .select { max-width: 60%; }
    .select select { max-width: 100%; }
    .row input:read-only { color: var(--hint); }
    textarea {
      flex: 1;
      min-height: 72px;
      padding: 0;
      border: 0;
      outline: none;
      font: 14px/1.4 ui-monospace, "SF Mono", Menlo, monospace;
      background: none;
      resize: vertical;
    }
    .search {
      display: block;
      width: 100%;
      margin-top: 12px;
      padding: 9px 12px;
      border: 0;
      border-radius: 10px;
      outline: none;
      background: var(--field);
      -webkit-appearance: none;
      appearance: none;
    }
    .primary {
      display: block;
      width: 100%;
      height: 50px;
      margin-top: 18px;
      border: 0;
      border-radius: 12px;
      font-weight: 600;
      color: var(--on-accent);
      background: var(--accent);
      cursor: pointer;
    }
    .primary:active { opacity: .85; }
    .row button.small {
      flex: none;
      padding: 0;
      border: 0;
      font-size: 16px;
      color: var(--link);
      background: none;
      cursor: pointer;
    }

    .backlink { margin: 0; padding: 14px 4px 0; border: 0; font-size: 17px; color: var(--link); background: none;
                cursor: pointer; }

    .segmented {
      display: flex;
      margin-top: 14px;
      padding: 2px;
      border-radius: 9px;
      background: var(--field);
    }
    .segmented button {
      flex: 1;
      padding: 6px 0;
      border: 0;
      border-radius: 7px;
      font-size: 14px;
      font-weight: 500;
      background: none;
      cursor: pointer;
    }
    .segmented button.on { background: var(--surface); box-shadow: 0 2px 6px rgba(0, 0, 0, .18); }

    /* --- the tab bar -------------------------------------------------------- */

    #tabbar {
      position: fixed;
      right: 0;
      bottom: 0;
      left: 0;
      z-index: 10;
      display: flex;
      justify-content: center;
      padding: 6px 8px calc(6px + env(safe-area-inset-bottom));
      background: var(--surface);
      box-shadow: 0 -.5px 0 var(--sep);
    }
    #tabbar button {
      flex: 1;
      max-width: 140px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
      padding: 2px 0;
      border: 0;
      font-size: 10.5px;
      font-weight: 500;
      color: var(--hint);
      background: none;
      cursor: pointer;
    }
    #tabbar button .icon { width: 27px; height: 27px; }
    #tabbar button.on { color: var(--link); }

    /* --- LLM spending ------------------------------------------------------- */

    .meter { height: 4px; margin-top: 8px; border-radius: 2px; overflow: hidden; background: var(--field); }
    .meter i { display: block; height: 100%; border-radius: 2px; background: var(--accent); }
    .meter.full i { background: var(--danger); }
    .periods { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; margin-top: 10px; }
    .periods button {
      padding: 10px 12px;
      border: 0;
      border-radius: 12px;
      text-align: left;
      background: var(--surface);
      cursor: pointer;
    }
    .periods button.on { box-shadow: inset 0 0 0 2px var(--accent); }
    .periods .label, .periods .note { font-size: 12px; color: var(--hint); }
    .periods .sum { margin: 2px 0; font-size: 21px; font-weight: 600; }
    .chart { display: block; width: 100%; height: 120px; }
    .chart .bar { fill: var(--accent); opacity: .4; }
    .chart .bar.today, .chart .bar.picked { opacity: 1; }
    .chart .bar.stopped { fill: var(--danger); opacity: 1; }
    .chart .limit { stroke: var(--danger); stroke-dasharray: 4 3; stroke-width: 1; }
    .chart .tap { fill: transparent; cursor: pointer; }
    .chart-box { padding: 14px 16px 12px; }
    .chart-box .sub { margin-top: 6px; color: var(--hint); font-size: 14px; }
    .money { flex: none; text-align: right; }
    .money .sub { text-align: right; }

    /* --- screens' heads, the timetable, the cards -------------------------- */

    .head { display: flex; align-items: flex-end; gap: 12px; }
    .head .large { flex: 1; min-width: 0; }
    .head-action {
      flex: none;
      display: grid;
      place-items: center;
      width: 36px;
      height: 36px;
      margin-bottom: 2px;
      padding: 0;
      border: 0;
      border-radius: 50%;
      color: var(--link);
      background: var(--surface);
      cursor: pointer;
    }
    .head-action .icon { width: 22px; height: 22px; }
    .row.timed:not(:last-child)::after { left: 76px; }
    .time { flex: none; display: flex; flex-direction: column; width: 48px; font-variant-numeric: tabular-nums; }
    .time b { font-size: 16px; font-weight: 600; }
    .time span { font-size: 13px; color: var(--hint); }
    .row.gone .time, .row.gone .name { opacity: .5; }
    .tag { font-weight: 500; }
    .tag.moved { color: var(--link); }
    .tag.off { color: var(--danger); }
    .grade { color: var(--text); font-variant-numeric: tabular-nums; }
    .row.fact .name { color: var(--hint); }
    .row.fact .value { max-width: 68%; color: var(--text); white-space: normal; overflow-wrap: anywhere; }
    .text { padding: 12px 16px; font-size: 15px; line-height: 1.4; }
    .row.field .label { flex: none; width: 92px; color: var(--hint); }
    .row.field .grow { flex: 1; min-width: 0; }
    .row.field .select { flex: 1; max-width: none; }
    .row.field select { width: 100%; text-align: left; color: var(--text); }
    .row.field input[type=file] { font-size: 14px; color: var(--hint); }
    .row.more .name { color: var(--link); font-size: 15px; }
    textarea.prose { font: 16px/1.4 inherit; font-family: inherit; min-height: 96px; }
    .badge.muted { color: var(--hint); background: var(--field); }
    body.locked { overflow: hidden; }
    .card {
      position: fixed;
      inset: 0;
      z-index: 20;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      background: rgba(0, 0, 0, 0);
      transition: background .2s;
    }
    .card.open { background: rgba(0, 0, 0, .5); }
    .card-panel {
      width: 100%;
      max-width: 640px;
      max-height: 88vh;
      overflow-y: auto;
      padding: 8px 16px calc(24px + env(safe-area-inset-bottom));
      border-radius: 16px 16px 0 0;
      background: var(--bg);
      box-shadow: 0 -1px 0 var(--sep);
      transform: translateY(100%);
      transition: transform .24s cubic-bezier(.2, .9, .3, 1);
    }
    .card.open .card-panel { transform: none; }
    .grip { width: 36px; height: 5px; margin: 0 auto 4px; border-radius: 3px; background: var(--sep); }
    .card-head h2 { margin: 12px 4px 2px; font-size: 21px; font-weight: 600; overflow-wrap: anywhere; }
    .card-head p { margin: 0 4px; font-size: 15px; color: var(--hint); }
    #tabbar button { position: relative; }
    #tabbar .count {
      position: absolute;
      top: 0;
      left: calc(50% + 6px);
      min-width: 18px;
      padding: 0 5px;
      border-radius: 9px;
      font-size: 11.5px;
      font-weight: 600;
      line-height: 18px;
      color: #fff;
      background: var(--danger);
    }

    #screen > * { animation: in .18s ease-out; }
    @keyframes in { from { opacity: 0; } }
  </style>
</head>
<body>
  <main id="screen"><p class="empty">…</p></main>
  <nav id="tabbar" hidden></nav>

  <script>
    const tg = window.Telegram.WebApp;
    tg.ready();
    tg.expand();
    try {  // the bars in the colour of the page (Bot API 6.1+)
      tg.setHeaderColor("secondary_bg_color");
      if (tg.themeParams.secondary_bg_color) tg.setBackgroundColor(tg.themeParams.secondary_bg_color);
    } catch (error) { /* an older client keeps its own colours */ }
    const $ = (id) => document.getElementById(id);
    // The Mini App's language (D41): English until /api/me tells the setting; every text is L(english, russian).
    let lang = "en";
    const L = (en, ru) => lang === "ru" ? ru : en;
    const LANGUAGE_NAMES = {en: "English", ru: "Русский"};  // each in its own language
    const KINDS = () => L({user: "private", bot: "bot", group: "group", supergroup: "supergroup", forum: "forum",
                           channel: "channel"},
                          {user: "личный", bot: "бот", group: "группа", supergroup: "супергруппа", forum: "форум",
                           channel: "канал"});
    // The settings of a chat (§5.1), in the order of the screen.
    const FLAGS = () => [
      ["study", L("Study", "Учебный"), L("news rank, deadlines", "ранг новостей, дедлайны")],
      ["urgent", L("Urgent", "Срочно"), L("a pin, a PDF or a message of an important person: parsed at once",
                                          "закреп, PDF или сообщение важного человека — разбор сразу")],
      ["summary", L("Summary", "Сводка"), L("in the daily summary", "включать в ежедневную сводку")],
      ["images", L("Images", "Картинки"), L("Haiku reads photos and screenshots, within the images a day",
                                            "фото и скриншоты читает Haiku, в пределах числа картинок в день")],
      ["pdf_content", L("Whole PDF", "PDF целиком"),
       L("sheets: a summary, deadlines from every page, what changed",
         "листочки: краткое содержание, дедлайны со всех страниц, что изменилось")],
    ];
    const BATCH_HOURS = [1, 2, 3, 4, 6, 8, 12, 24];
    const WEEKDAYS = () => L(["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"], ["вс", "пн", "вт", "ср", "чт", "пт", "сб"]);
    const TYPES_RU = {Lecture: "лекция", Seminar: "семинар", Consultation: "консультация", Event: "событие",
                      "Interim assessment": "рубежный контроль", Exam: "экзамен", Lab: "лабораторная", Class: "занятие"};
    const SOURCES = () => L({hseapp: "HSE App X", ical: "RUZ", mail: "mail", tg: "chat", ha: "own"},
                            {hseapp: "HSE App X", ical: "РУЗ", mail: "почта", tg: "чат", ha: "свой"});
    const CATEGORIES = () => L({study: "study", personal: "personal"}, {study: "учёба", personal: "личное"});
    let me = null;

    // --- talking to the service ----------------------------------------------

    async function call(path, options = {}) {
      const response = await fetch(path, {...options, headers: {...options.headers,
        Authorization: "tma " + tg.initData}});
      if (response.status === 401) throw new Error(L("Open the app from the bot.", "Откройте приложение из бота."));
      if (response.status === 403) throw new Error(L("No access.", "Нет доступа."));
      if (!response.ok) throw new Error(await response.text() || L("Error ", "Ошибка ") + response.status);
      return response.json();
    }

    function send(path, method, values) {
      return call(path, {method, body: JSON.stringify(values), headers: {"Content-Type": "application/json"}});
    }

    // What the screens show, by the API path; emptied on every move between screens, so a screen shows fresh data
    // and an action keeps its answer here for the redraw.
    let cache = {};

    async function get(path) {
      if (!(path in cache)) cache[path] = call(path);
      return cache[path];
    }

    // A screen without its API (the service runs without that part) shows the rest.
    function maybe(path) {
      return get(path).catch(() => null);
    }

    // An action: the request, its answer kept for `path`, the screen drawn anew; an error is said in a popup.
    async function act(path, method, values, keep = path) {
      try {
        const answer = await send(path, method, values);
        if (keep) cache[keep] = Promise.resolve(answer);
        redraw();
        return answer;
      } catch (error) {
        tell(error.message);
        redraw();
        return null;
      }
    }

    // --- Telegram's dialogs, with the browser's outside Telegram ---------------

    // Named apart from the browser's alert and confirm, which they fall back on outside Telegram.
    function tell(text) {
      try { tg.showAlert(text); } catch (error) { window.alert(text); }
    }

    function askYes(text) {
      return new Promise((resolve) => {
        try { tg.showConfirm(text, resolve); } catch (error) { resolve(window.confirm(text)); }
      });
    }

    function haptic() {
      try { tg.HapticFeedback.selectionChanged(); } catch (error) { /* no haptics */ }
    }

    // --- building blocks -------------------------------------------------------

    function el(tag, props = {}, ...children) {
      const node = Object.assign(document.createElement(tag), props);
      node.append(...children.filter((child) => child !== null && child !== undefined && child !== false));
      return node;
    }

    const ICONS = {
      home: '<path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/>',
      deadlines: '<path d="m9 11 3 3L21 5"/><path d="M20 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h11"/>',
      schedule: '<rect x="3" y="4" width="18" height="17" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/>',
      image: '<rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-4-4L6 21"/>',
      study: '<path d="M2 4h6a4 4 0 0 1 4 4v13a3 3 0 0 0-3-3H2zM22 4h-6a4 4 0 0 0-4 4v13a3 3 0 0 1 3-3h7z"/>',
      settings: '<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/>',
      chats: '<path d="M7.9 20A9 9 0 1 0 4 16.1L2 22Z"/>',
      hse: '<path d="M22 10 12 5 2 10l10 5 10-5Z"/><path d="M6 12v5c3 3 9 3 12 0v-5"/>',
      grades: '<path d="m12 3 2.8 5.7 6.2.9-4.5 4.4 1 6.2L12 17.3 6.5 20.2l1-6.2L3 9.6l6.2-.9z"/>',
      mail: '<rect x="3" y="5" width="18" height="14" rx="2"/><path d="m21 7-9 6-9-6"/>',
      book: '<path d="M4 19.5V5a2 2 0 0 1 2-2h14v16H6.5A2.5 2.5 0 0 0 4 21.5 2.5 2.5 0 0 0 6.5 24"/><path d="M8 7h8"/>',
      summary: '<path d="M4 6h16M4 12h16M4 18h10"/>',
      sheet: '<path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><path d="M14 3v6h6"/>',
      clock: '<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
      bolt: '<path d="M13 2 4 14h7l-1 8 9-12h-7z"/>',
      plus: '<path d="M12 5v14M5 12h14"/>',
      chev: '<path d="m1 1 6 5.5L1 12" stroke-width="2"/>',
    };

    function icon(name, className = "") {
      const node = el("span", {className: "icon " + className});
      node.innerHTML = name === "chev" ? `<svg viewBox="0 0 8 13">${ICONS.chev}</svg>`
        : `<svg viewBox="0 0 24 24">${ICONS[name]}</svg>`;
      return node;
    }

    function tile(name, color) {
      const node = el("span", {className: "tile"}, icon(name));
      node.style.setProperty("--c", color);
      return node;
    }

    function toggle(checked, onchange) {
      const input = el("input", {type: "checkbox", checked});
      input.onchange = () => { haptic(); onchange(input.checked); };
      return el("label", {className: "switch"}, input, el("span"));
    }

    function selectOf(options, value, onchange) {
      const select = el("select", {}, ...options.map(([v, text]) => el("option", {value: v}, text)));
      select.value = value;
      select.onchange = () => onchange(select.value);
      return el("span", {className: "select"}, select);
    }

    function numberInput(value, attrs, onchange) {
      const input = el("input", {type: "number", value, step: 1, ...attrs,
        inputMode: attrs.step && attrs.step < 1 ? "decimal" : "numeric"});
      input.onchange = () => onchange(Number(input.value));
      return input;
    }

    // A row of a list: a title with a line under it, something on the right; with `go` the whole row is a button.
    function row({title, sub, value, control, go, lead, className = "", wrap = false}) {
      const main = el("div", {className: "main"}, el("div", {className: "name" + (wrap ? " wrap" : "")}, title),
        sub ? el("div", {className: "sub"}, sub) : null);
      const node = el("div", {className: "row" + (go ? " tap" : "") + (lead ? " lead" : "") + " " + className},
        lead || null, main, value !== undefined && value !== null && value !== ""
          ? el("span", {className: "value"}, value) : null, control || null, go ? icon("chev", "chev") : null);
      if (go) node.onclick = go;
      return node;
    }

    // A row that is a button: centred link text, or red for a deletion.
    function button(text, onclick, {danger = false, plus = false, disabled = false} = {}) {
      const node = el("div", {className: "row button" + (danger ? " danger" : "") + (plus ? " left" : ""),
        role: "button"}, plus ? icon("plus") : null, el("span", {}, text));
      if (disabled) node.setAttribute("aria-disabled", "true");
      node.onclick = onclick;
      return node;
    }

    // A section of a screen: a header, its rows on a card, a footnote under them.
    function section(header, rows, foot) {
      const shown = rows.filter(Boolean);
      return [header ? el("h3", {}, header) : null, shown.length ? el("div", {className: "list"}, ...shown) : null,
        foot ? el("p", {className: "foot"}, foot) : null].filter(Boolean);
    }

    function notice(text, go) {
      const node = el("div", {className: "notice" + (go ? " tap" : "")}, el("span", {className: "dot"}),
        el("div", {className: "main"}, text), go ? icon("chev", "chev") : null);
      if (go) node.onclick = go;
      return node;
    }

    const empty = (text) => el("p", {className: "empty"}, text);

    // The big primary action: Telegram's main button in Telegram, a button at the end of the screen elsewhere.
    let mainAction = null;

    function primary(text, onclick) {
      if (tg.initData && tg.MainButton) {
        mainAction = async () => { tg.MainButton.showProgress(); try { await onclick(); } finally { tg.MainButton.hideProgress(); } };
        tg.MainButton.setText(text);
        tg.MainButton.onClick(mainAction);
        tg.MainButton.show();
        return null;
      }
      const node = el("button", {className: "primary"}, text);
      node.onclick = onclick;
      return node;
    }

    function clearPrimary() {
      if (mainAction) {
        tg.MainButton.offClick(mainAction);
        tg.MainButton.hide();
        mainAction = null;
      }
    }

    // --- dates -----------------------------------------------------------------

    function when(start, end) {
      const day = new Date(start.slice(0, 10) + "T00:00:00");
      let text = `${WEEKDAYS()[day.getDay()]} ${start.slice(8, 10)}.${start.slice(5, 7)} ${start.slice(11, 16)}`;
      if (end && end.slice(0, 10) === start.slice(0, 10)) text += "–" + end.slice(11, 16);
      return text;
    }

    function hours(start, end) {
      let text = start.slice(11, 16);
      if (end && end.slice(0, 10) === start.slice(0, 10)) text += "–" + end.slice(11, 16);
      return text;
    }

    function dayLabel(iso) {
      const date = new Date(iso + "T00:00:00");
      return `${WEEKDAYS()[date.getDay()]} ${iso.slice(8, 10)}.${iso.slice(5, 7)}`;
    }

    function daysFrom(today, iso) {
      return Math.round((new Date(iso + "T00:00:00") - new Date(today + "T00:00:00")) / 86400000);
    }

    // A deadline's day as the forum's pinned list says it; `today` is the service's, a Moscow date.
    function dueMark(iso, today) {
      const days = daysFrom(today, iso);
      if (days === 0) return L("today", "сегодня");
      if (days === 1) return L("tomorrow", "завтра");
      return dayLabel(iso);
    }

    function dueValue(iso, today) {
      const days = daysFrom(today, iso);
      return el("span", {className: days < 0 ? "late" : days <= 1 ? "soon" : ""}, dueMark(iso, today));
    }

    function room(value) {
      if (!value) return "";
      return /^https?:\/\//.test(value) ? L("link", "ссылка") : value === "online" ? L("online", "онлайн") : value;
    }

    function usd(value) {
      return "$" + (value >= 10 ? value.toFixed(0) : value >= 0.1 || !value ? value.toFixed(2) : value.toFixed(3));
    }

    // n with its word: [one, two to four, five and more] in Russian, [one, many] in English.
    function count(n, en, ru) {
      if (lang !== "ru") return `${n} ${n === 1 ? en[0] : en[1]}`;
      const last = n % 10, tens = n % 100;
      return `${n} ${last === 1 && tens !== 11 ? ru[0] : last >= 2 && last <= 4 && (tens < 12 || tens > 14) ? ru[1] : ru[2]}`;
    }

    const runs = (n) => count(n, ["call", "calls"], ["вызов", "вызова", "вызовов"]);

    function openLink(url) {  // a t.me link opens in Telegram itself, not in a browser
      if (url.startsWith("https://t.me/")) tg.openTelegramLink(url); else tg.openLink(url);
    }

    function gradeMark(value) {
      const rounded = Math.round(value * 10) / 10;
      return Number.isInteger(rounded) ? String(rounded) : rounded.toFixed(1);
    }

    // --- navigation ----------------------------------------------------------------
    // Four tabs at the bottom, each with one job; a screen opened from a tab goes on a stack that Telegram's back
    // button walks down.

    const TABS = () => [["deadlines", L("Deadlines", "Дедлайны")], ["schedule", L("Timetable", "Расписание")],
                        ["study", L("Study", "Учёба")], ["settings", L("Settings", "Настройки")]];
    const nav = {tab: "deadlines", stack: [], study: "grades"};
    let drawing = 0;

    function showTab(name) {
      if (nav.tab === name && !nav.stack.length) return;
      haptic();
      nav.tab = name;
      nav.stack = [];
      draw(true);
    }

    function push(page) {
      if (page === hsePage) hse.failed = false;
      nav.stack.push(page);
      draw(true);
    }

    function back() {
      nav.stack.pop();
      draw(true);
    }

    function redraw() {
      draw(false);
    }

    // `fresh`: a move to another screen, with data asked anew and the screen from its top.
    async function draw(fresh) {
      if (fresh) cache = {};
      closeCard(true);
      const token = ++drawing;
      const page = nav.stack.at(-1) || ROOTS[nav.tab];
      clearPrimary();
      tg.BackButton[nav.stack.length ? "show" : "hide"]();
      $("tabbar").hidden = nav.stack.length > 0;
      document.body.classList.toggle("inner", nav.stack.length > 0);
      for (const button of $("tabbar").children) button.classList.toggle("on", button.dataset.tab === nav.tab);
      let nodes;
      try {
        nodes = await page();
      } catch (error) {
        nodes = [empty(error.message)];
      }
      if (token !== drawing) return;  // another screen was asked for meanwhile
      if (nav.stack.length && !tg.initData) {  // outside Telegram there is no back button of its own
        const link = el("button", {className: "backlink"}, "‹ " + L("Back", "Назад"));
        link.onclick = back;
        nodes = [link, ...nodes];
      }
      const y = window.scrollY;
      $("screen").replaceChildren(...nodes.flat(2).filter(Boolean));
      window.scrollTo(0, fresh ? 0 : y);
      markProblems();  // an action may have fixed or caused one
    }

    function drawTabbar() {
      $("tabbar").replaceChildren(...TABS().map(([name, title]) => {
        const button = el("button", {}, icon(name), el("span", {}, title));
        button.dataset.tab = name;
        button.onclick = () => showTab(name);
        return button;
      }));
      $("tabbar").hidden = nav.stack.length > 0;
    }

    // --- the card from the bottom -------------------------------------------------------------------
    // A tap on a deadline, a class or a sheet opens its card: what it is, and what can be done with it. The lists
    // themselves only show; every change is an action on a card.

    let card = null;

    function openCard(...children) {
      closeCard(true);
      const panel = el("div", {className: "card-panel"}, el("div", {className: "grip"}),
        ...children.flat(2).filter(Boolean));
      const shade = el("div", {className: "card"}, panel);
      shade.onclick = (event) => { if (event.target === shade) closeCard(); };
      document.body.append(shade);
      document.body.classList.add("locked");
      requestAnimationFrame(() => shade.classList.add("open"));
      card = shade;
      tg.BackButton.show();
      haptic();
    }

    function closeCard(now = false) {
      if (!card) return;
      const shade = card;
      card = null;
      document.body.classList.remove("locked");
      if (!nav.stack.length) tg.BackButton.hide();
      if (now) return shade.remove();
      shade.classList.remove("open");
      setTimeout(() => shade.remove(), 220);
    }

    function cardHead(title, sub) {
      return el("div", {className: "card-head"}, el("h2", {}, title), sub ? el("p", {}, sub) : null);
    }

    // A fact on a card: what on the left, its value on the right.
    function fact(name, value) {
      return value ? row({title: name, value, className: "fact"}) : null;
    }

    // An action of a card: the card closes, then the action runs.
    function cardButton(text, run, options) {
      return button(text, () => { closeCard(); run(); }, options);
    }

    function cardList(...rows) {
      const shown = rows.flat().filter(Boolean);
      return shown.length ? el("div", {className: "list"}, ...shown) : null;
    }

    const cardFoot = (text) => el("p", {className: "foot"}, text);

    // A screen's big title, with a round button at its right.
    function header(title, action) {
      return el("div", {className: "head"}, el("h1", {className: "large"}, title), action || null);
    }

    function headButton(name, onclick) {
      const node = el("button", {className: "head-action"}, icon(name));
      node.onclick = onclick;
      return node;
    }

    // A change whose answer is not the screen's data: the screen asks for its data anew.
    async function change(path, method, values, ...stale) {
      try {
        await send(path, method, values);
      } catch (error) {
        tell(error.message);
      }
      for (const key of stale) delete cache[key];
      redraw();
    }

    // --- adding and forms -------------------------------------------------------------------------------

    // The «+» of every tab: what to add, the tab's own kind first.
    function addCard(first) {
      const kinds = [["deadline", L("Deadline", "Дедлайн"), "deadlines", "#3e88f7", () => deadlinePage(null)],
                     ["event", L("Event", "Событие"), "schedule", "#e0605a", () => eventPage(null)],
                     ["grade", L("Grade", "Оценка"), "grades", "#34a853", () => gradePage(null)],
                     ["sheet", L("Sheet", "Листочек"), "sheet", "#8e8e93", () => sheetNewPage()]];
      kinds.sort((a, b) => (b[0] === first) - (a[0] === first));
      openCard(cardHead(L("Add", "Добавить")), cardList(kinds.map(([, title, name, color, page]) =>
        row({title, lead: tile(name, color), go: () => { closeCard(true); push(page); }}))));
    }

    const addButton = (first) => headButton("plus", () => addCard(first));

    // A field of a form: its name on the left, what to fill in on the right.
    function field(name, input) {
      return el("div", {className: "row field"}, el("span", {className: "label"}, name), input);
    }

    const input = (value, attrs = {}) => el("input", {className: "grow", value: value ?? "", ...attrs});

    // Saves a form: the request, then back to where the form was opened from.
    async function submit(path, method, values) {
      try {
        await (values instanceof FormData ? call(path, {method, body: values}) : send(path, method, values));
        back();
      } catch (error) {
        tell(error.message);
      }
    }

    // --- Deadlines -----------------------------------------------------------------------------------

    const FROM = () => L({hseapp: "HSE App X", ical: "RUZ", mail: "Mail", tg: "Chat", ha: "Own"},
                         {hseapp: "HSE App X", ical: "РУЗ", mail: "Почта", tg: "Чат", ha: "Свой"});

    // Where a deadline comes from, as precisely as it is known: the chat or the letter, else the source.
    const deadlineFrom = (d) => d.source === "ha" ? FROM().ha : d.from || FROM()[d.source] || d.source;

    async function deadlinesPage() {
      const data = await get("api/deadlines");
      const today = data.today;
      const parts = [header(L("Deadlines", "Дедлайны"), addButton("deadline"))];
      if (data.hseapp.login_needed) {
        parts.push(notice(L("HSE App X needs a login: its deadlines are not updated.",
          "HSE App X нужен вход: дедлайны оттуда не обновляются."), () => push(hsePage)));
      }
      const listed = new Set(data.items.map((d) => d.uid));
      const all = [...data.items, ...data.own.filter((d) => !listed.has(d.uid)).map((d) => ({...d, source: "ha"}))];
      const groups = [[L("Overdue", "Просрочены"), (n) => n < 0, true], [L("Today", "Сегодня"), (n) => n === 0, false],
                      [L("Tomorrow", "Завтра"), (n) => n === 1, false],
                      [L("This week", "На этой неделе"), (n) => n > 1 && n <= 7, true],
                      [L("Later", "Позже"), (n) => n > 7, true]];
      for (const [title, fits, dated] of groups) {
        const part = all.filter((d) => fits(daysFrom(today, d.due)));
        if (part.length) parts.push(section(title, part.map((d) => deadlineRow(d, data, dated))));
      }
      if (!all.length) parts.push(empty(L("No deadlines.", "Дедлайнов нет.")));
      if (data.hidden.length) {
        parts.push(el("div", {className: "list", style: "margin-top: 26px"}, row({title: L("Hidden", "Скрытые"),
          value: String(data.hidden.length), go: () => push(hiddenDeadlinesPage)})));
      }
      parts.push(el("p", {className: "foot"}, L("The same list is in Tablo and in the pinned message of the "
        + "«Deadlines» topic.", "Тот же список — в Tablo и в закрепе темы «Дедлайны».")));
      return parts;
    }

    function deadlineRow(d, data, dated) {
      const sub = [deadlineFrom(d)];  // the course is in the title already, «Calc HW 3»; its full name is on the card
      if (d.category === "personal") sub.push(CATEGORIES().personal);
      return row({title: d.title, sub: sub.filter(Boolean).join(" · "),
        value: dated ? dueValue(d.due, data.today) : null, go: () => deadlineCard(d, data)});
    }

    function deadlineCard(d, data) {
      const own = d.source === "ha";
      const days = daysFrom(data.today, d.due);
      const due = (days === 0 || days === 1 ? dueMark(d.due, data.today) + ", " : "") + dayLabel(d.due)
        + (days < 0 ? L(" · overdue", " · просрочен") : "");
      const from = d.link ? el("a", {href: d.link, onclick: (e) => { e.preventDefault(); openLink(d.link); }},
        deadlineFrom(d)) : deadlineFrom(d);
      openCard(cardHead(d.title),
        cardList(fact(L("Due", "Срок"), el("span", {className: days < 0 ? "late" : ""}, due)),
          fact(L("Course", "Предмет"), d.course), fact(L("From", "Откуда"), from),
          fact(L("List", "Список"), CATEGORIES()[d.category])),
        cardList(cardButton(L("Edit", "Изменить"), () => push(() => deadlinePage(own
          ? data.own.find((o) => o.uid === d.uid) || d : d, !own))),
        own ? cardButton(L("Delete", "Удалить"), async () => {
          if (await askYes(L("Delete this own deadline?", "Удалить свой дедлайн?"))) {
            act("api/deadlines/" + encodeURIComponent(d.uid), "DELETE", undefined, "api/deadlines");
          }
        }, {danger: true}) : cardButton(L("Hide", "Скрыть"), () => act("api/deadlines/" + encodeURIComponent(d.uid),
          "DELETE", undefined, "api/deadlines"), {danger: true})),
        own ? null : cardFoot(L("Changed, it becomes your own and the source's one is hidden. A hidden one does not "
          + "come back by itself, even if the source sends it again; it can be restored in «Hidden».", "После правки "
          + "дедлайн станет своим, а дедлайн источника скроется. Скрытый сам не вернётся, даже если источник пришлёт "
          + "его снова; вернуть можно в «Скрытых».")));
    }

    async function hiddenDeadlinesPage() {
      const data = await get("api/deadlines");
      return [el("h1", {className: "title"}, L("Hidden deadlines", "Скрытые дедлайны")),
        data.hidden.length ? section(null, data.hidden.map((h) => {
          const restore = el("button", {className: "small"}, L("Restore", "Вернуть"));
          restore.onclick = () => act("api/hidden/" + encodeURIComponent(h.uid), "DELETE", undefined, "api/deadlines");
          return row({title: h.title, sub: `${dayLabel(h.due)} · ${deadlineFrom(h)}`, control: restore});
        }), L("A restored deadline is back if its source still has it.",
          "Возвращённый дедлайн появится снова, если он ещё есть у источника.")) : empty(L("Nothing is hidden.",
          "Скрытых нет."))];
    }

    // An own deadline, a new one, or a source's one changed (`copy`: saving hides the source's one).
    async function deadlinePage(d, copy = false) {
      const data = await get("api/deadlines");
      const fresh = !d;
      d = d || {title: "", due: data.today, category: "study"};
      const title = input(d.title, {maxLength: 200, placeholder: L("Sign up for a minor", "Записаться на майнор")});
      const due = input(d.due, {type: "date"});
      let category = d.category;
      return [el("h1", {className: "title"}, fresh ? L("New deadline", "Новый дедлайн") : L("Edit deadline", "Изменить дедлайн")),
        section(null, [field(L("What", "Что"), title), field(L("Due", "Срок"), due),
          field(L("List", "Список"), fresh ? selectOf(Object.entries(CATEGORIES()), category, (value) => { category = value; })
            : el("span", {className: "grow"}, CATEGORIES()[d.category]))],
          copy ? L("The source's deadline is hidden, your own with these values takes its place.",
            "Дедлайн источника скроется, его место займёт свой с этими данными.")
            : L("Shown in Tablo and in the «Deadlines» topic. Deleted by itself 30 days after it is due.",
              "Виден в Tablo и в теме «Дедлайны». Через 30 дней после срока удаляется сам.")),
        primary(L("Save", "Сохранить"), () => fresh
          ? submit("api/deadlines", "POST", {title: title.value, due: due.value, category})
          : submit("api/deadlines/" + encodeURIComponent(d.uid), "PATCH", {title: title.value, due: due.value}))];
    }

    // --- Timetable ------------------------------------------------------------------------------------
    // The classes of RUZ with the corrections applied (the chats' and your own), and the events, day by day.

    let agendaDays = 7;
    const TYPES = () => L({Lecture: "lecture", Seminar: "seminar", Consultation: "consultation", Event: "event",
                           "Interim assessment": "interim assessment", Exam: "exam", Lab: "lab", Class: "class"}, TYPES_RU);
    const EVENT_TYPES = ["Event", "Consultation", "Lecture", "Seminar", "Exam"];

    function addDays(iso, n) {
      const date = new Date(iso + "T12:00:00");
      date.setDate(date.getDate() + n);
      return date.toISOString().slice(0, 10);
    }

    function dayTitle(iso, today) {
      const days = daysFrom(today, iso);
      if (days === 0) return L("Today · ", "Сегодня · ") + dayLabel(iso);
      if (days === 1) return L("Tomorrow · ", "Завтра · ") + dayLabel(iso);
      return dayLabel(iso);
    }

    const isLink = (value) => /^https?:\/\//.test(value || "");

    function place(value) {
      if (!value) return "";
      return isLink(value) || value === "online" ? L("online", "онлайн") : value;
    }

    // A correction is in force on this class: moved or cancelled where RUZ has it otherwise.
    const corrected = (item) => item.event && item.event.correction && !item.event.hidden;

    // Where an entry comes from: RUZ, the chat or the letter that told it or corrected it, or you.
    function itemFrom(item) {
      const ev = item.event;
      if (ev && ev.own && (!ev.correction || !ev.hidden)) return L("you", "вы");
      if (ev && ev.chat && (!ev.correction || !ev.hidden)) return ev.chat;
      return L("RUZ", "РУЗ");
    }

    async function schedulePage() {
      const data = await get("api/agenda");
      const parts = [header(L("Timetable", "Расписание"), addButton("event"))];
      if (data.ruz.error) parts.push(notice(L("RUZ is not read: ", "РУЗ не читается: ") + data.ruz.error));
      if (data.ruz.subjects_error) {
        parts.push(notice(L("The course titles wait for Haiku: ", "Названия предметов ждут Haiku: ") + data.ruz.subjects_error));
      }
      const last = addDays(data.today, agendaDays - 1);
      for (let day = data.today; day <= last; day = addDays(day, 1)) {
        const items = data.items.filter((item) => item.start.slice(0, 10) === day);
        if (!items.length && day !== data.today) continue;
        parts.push(el("h3", {}, dayTitle(day, data.today)), el("div", {className: "list"}, ...(items.length
          ? items.map((item) => agendaRow(item, data)) : [row({title: L("Nothing", "Ничего нет"), className: "faded"})])));
      }
      if (data.items.some((item) => item.start.slice(0, 10) > last)) {
        parts.push(el("div", {className: "list", style: "margin-top: 22px"}, button(L("One more week", "Ещё неделя"),
          () => { agendaDays += 7; redraw(); })));
      }
      if (data.hidden.length) {
        parts.push(el("div", {className: "list", style: "margin-top: 22px"}, row({title: L("Removed events",
          "Убранные события"), value: String(data.hidden.length), go: () => push(hiddenEventsPage)})));
      }
      parts.push(el("p", {className: "foot"}, L("Classes come from RUZ", "Пары — из РУЗ")
        + (data.ruz.ok_at ? L(", updated ", ", обновлено ") + when(data.ruz.ok_at) : "") + L("; events and "
        + "corrections, from the chats, the mail and you.", "; события и правки — из чатов, почты и ваши.")));
      return parts;
    }

    function agendaRow(item, data) {
      const time = el("div", {className: "time"}, el("b", {}, item.start.slice(11, 16)),
        el("span", {}, item.end.slice(11, 16)));
      const sub = [place(item.location), TYPES()[item.type] || item.type.toLowerCase(), itemFrom(item)].filter(Boolean);
      const tags = [];
      if (item.cancelled) tags.push(el("span", {className: "tag off"}, L("cancelled", "отменена")));
      else if (corrected(item)) tags.push(el("span", {className: "tag moved"}, L("moved", "перенос")));
      if (!item.required && !item.cancelled) tags.push(el("span", {className: "tag"}, L("optional", "по желанию")));
      return row({lead: time, className: "timed" + (item.cancelled ? " gone" : ""),
        title: el("span", {className: item.cancelled ? "struck" : ""}, item.title),
        sub: el("span", {}, ...tags.flatMap((tag) => [tag, " · "]), sub.join(" · ")),
        go: () => agendaCard(item, data)});
    }

    function agendaCard(item, data) {
      const ev = item.event;
      const hide = (hidden) => change("api/events/" + ev.id, "PATCH", {hidden}, "api/agenda");
      const remove = () => change("api/events/" + ev.id, "DELETE", undefined, "api/agenda");
      const fromText = itemFrom(item);
      const link = ev && ev.link && (!ev.correction || !ev.hidden) ? ev.link : null;
      const facts = [
        fact(L("When", "Когда"), `${dayLabel(item.start.slice(0, 10))}, ${hours(item.start, item.end)}`),
        fact(L("Where", "Где"), isLink(item.location) ? el("a", {href: item.location,
          onclick: (e) => { e.preventDefault(); openLink(item.location); }}, L("the link", "по ссылке")) : place(item.location)),
        fact(L("What", "Что"), TYPES()[item.type] || item.type),
        fact(L("From", "Откуда"), link ? el("a", {href: link, onclick: (e) => { e.preventDefault(); openLink(link); }},
          fromText) : fromText)];
      const isClass = item.source === "ruz" || (ev && ev.correction);
      let actions = [], foot = null;
      if (isClass) {
        actions.push(cardButton(L("Move or cancel", "Перенести или отменить"), () => push(() => eventPage(item))));
        if (ev && !ev.hidden) {
          facts.push(fact(L("In RUZ", "В РУЗ"), `${dayLabel(ev.class.start.slice(0, 10))}, ${hours(ev.class.start,
            ev.class.end)}` + (ev.class.room ? ", " + place(ev.class.room) : "")));
          actions.push(ev.own ? cardButton(L("Undo your correction", "Отменить свою правку"), remove, {danger: true})
            : cardButton(L("The correction is wrong: as in RUZ", "Правка неверна — как в РУЗ"), () => hide(true),
              {danger: true}));
          foot = ev.own ? L("Your correction: the calendars and Tablo show the class so, until RUZ itself changes it.",
            "Ваша правка: так пара стоит в календарях и в Tablo, пока РУЗ сам её не изменит.")
            : L(`The chat ${ev.cancelled ? "cancelled" : "moved"} the class; the calendars show it so.`,
              `В чате пару ${ev.cancelled ? "отменили" : "перенесли"}; так она и стоит в календарях.`);
        } else if (ev && ev.hidden) {
          actions.push(cardButton(L("Apply the chat's correction", "Применить правку из чата"), () => hide(false)));
          foot = L(`${ev.chat || "A chat"} ${ev.cancelled ? "cancelled the class" : "moved the class to " + when(ev.start, ev.end)}, `
            + "but you turned the correction off: the class is as in RUZ.", `${ev.chat || "В чате"}: пару `
            + `${ev.cancelled ? "отменили" : "перенесли на " + when(ev.start, ev.end)}, но вы отключили правку — пара `
            + "стоит как в РУЗ.");
        }
      } else if (ev) {
        actions = [cardButton(L("Edit", "Изменить"), () => push(() => eventPage(item))),
          cardButton(item.required ? L("Make it optional", "Сделать необязательным")
            : L("Make it required", "Сделать обязательным"), () => change("api/events/" + ev.id, "PATCH",
            {required: !item.required}, "api/agenda")),
          ev.own ? cardButton(L("Delete", "Удалить"), async () => {
            if (await askYes(L("Delete this event?", "Удалить событие?"))) remove();
          }, {danger: true}) : cardButton(L("Remove from the timetable", "Убрать из расписания"), () => hide(true),
            {danger: true})];
        foot = item.required ? L("Required: in the main calendar, where you must be.",
          "Обязательное — в основном календаре, где нужно быть.") : L("Optional: in the second calendar, where you "
          + "may come.", "По желанию — во втором календаре, куда можно прийти.");
      }
      openCard(cardHead(el("span", {className: item.cancelled ? "struck" : ""}, item.title),
        item.cancelled ? el("span", {className: "late"}, L("Cancelled", "Отменена")) : null),
        cardList(facts), actions.length ? cardList(actions) : null, foot ? cardFoot(foot) : null);
    }

    async function hiddenEventsPage() {
      const data = await get("api/agenda");
      return [el("h1", {className: "title"}, L("Removed events", "Убранные события")),
        data.hidden.length ? section(null, data.hidden.map((ev) => {
          const restore = el("button", {className: "small"}, L("Restore", "Вернуть"));
          restore.onclick = () => change("api/events/" + ev.id, "PATCH", {hidden: false}, "api/agenda");
          return row({title: ev.title, sub: [when(ev.start, ev.end), ev.chat].filter(Boolean).join(" · "), control: restore});
        })) : empty(L("Nothing is removed.", "Убранных нет."))];
    }

    // A new event, an event changed, or a RUZ class moved or cancelled (a correction of your own).
    async function eventPage(item) {
      const data = await get("api/agenda");
      const ev = item && item.event;
      const isClass = item && (item.source === "ruz" || (ev && ev.correction));
      const title = input(item && item.title, {maxLength: 120, placeholder: L("Meeting with the supervisor",
        "Встреча с научруком")});
      const day = input(item ? item.start.slice(0, 10) : data.today, {type: "date"});
      const from = input(item ? item.start.slice(11, 16) : "10:00", {type: "time"});
      const to = input(item ? item.end.slice(11, 16) : "11:20", {type: "time"});
      const where = input(item && item.location, {placeholder: L("Room or link", "Аудитория или ссылка")});
      let kind = item ? item.type : "Event";
      let required = item ? item.required : true;
      let cancelled = item ? item.cancelled : false;
      const fields = isClass ? [] : [field(L("Title", "Название"), title),
        field(L("Type", "Тип"), selectOf([...new Set([...EVENT_TYPES, kind])].map((t) => [t, TYPES()[t] || t.toLowerCase()]),
          kind, (value) => { kind = value; }))];
      fields.push(field(L("Date", "Дата"), day), field(L("From", "С"), from), field(L("To", "До"), to),
        field(L("Where", "Где"), where));
      const save = () => {
        const start = `${day.value}T${from.value}:00`, end = `${day.value}T${to.value}:00`;
        if (isClass) return submit("api/corrections", "POST", {class_uid: item.uid, start, end, room: where.value, cancelled});
        const values = {title: title.value, kind, start, end, room: where.value, required};
        return ev ? submit("api/events/" + ev.id, "PATCH", values) : submit("api/events", "POST", values);
      };
      return [el("h1", {className: "title"}, !item ? L("New event", "Новое событие") : isClass
        ? L("Move or cancel the class", "Перенести или отменить пару") : L("Edit event", "Изменить событие")),
        isClass ? el("p", {className: "subtitle"}, item.title) : null,
        section(null, fields),
        section(null, [isClass ? row({title: L("Cancelled", "Отменена"), control: toggle(cancelled, (on) => { cancelled = on; })})
          : row({title: L("Required", "Обязательное"), sub: L("off: the optional calendar", "выкл. — необязательный календарь"),
            control: toggle(required, (on) => { required = on; })})],
        isClass ? L("RUZ stays as it is: your correction moves or cancels the class in the calendars and in Tablo, until "
          + "RUZ itself changes the class.", "РУЗ не меняется: ваша правка переносит или отменяет пару в календарях и "
          + "в Tablo, пока РУЗ сам её не изменит.")
          : ev && !ev.own ? L("The chat's event is hidden and your own copy with the changes takes its place: a later "
            + "message of the chat does not undo them.", "Событие чата скроется, его место займёт ваша копия с "
            + "изменениями: следующее сообщение чата их не отменит.")
          : L("Your own event: in the calendars and in Tablo.", "Своё событие — в календарях и в Tablo.")),
        primary(L("Save", "Сохранить"), save)];
    }

    // --- Study: grades and sheets ----------------------------------------------------------------------

    async function studyPage() {
      const segments = [["grades", L("Grades", "Оценки")], ["sheets", L("Sheets", "Листочки")]];
      const bar = el("div", {className: "segmented"}, ...segments.map(([name, title]) => {
        const b = el("button", {className: name === nav.study ? "on" : ""}, title);
        b.onclick = () => { if (nav.study !== name) { haptic(); nav.study = name; draw(true); } };
        return b;
      }));
      const body = await (nav.study === "sheets" ? sheetsPart() : gradesPart());
      return [header(L("Study", "Учёба"), addButton(nav.study === "sheets" ? "sheet" : "grade")), bar, body];
    }

    const bookName = (sheet) => sheet.name || sheet.title || sheet.label || L("Untitled gradebook", "Таблица без названия");

    function gradeValue(g) {
      return gradeMark(g.value) + (g.bonus ? ` ${g.bonus > 0 ? "+" : ""}${g.bonus}` : "");
    }

    function gradeRow(g, sheet) {
      return row({title: el("span", {}, g.label, g.new ? el("span", {className: "badge"}, L("new", "новая")) : null,
        g.edited ? el("span", {className: "badge muted"}, L("edited", "изменена")) : null),
        sub: g.max && g.max !== 10 ? `${g.raw} ${L("of", "из")} ${g.max}` : null,
        value: el("b", {className: "grade"}, gradeValue(g)), go: () => gradeCard(g, sheet)});
    }

    async function gradesPart() {
      const data = await get("api/grades");
      const parts = [];
      if (!data.student) {
        parts.push(notice(L("Set your name: without it the gradebooks are not read.",
          "Укажите ФИО: без него таблицы не читаются."), () => push(gradesSettingsPage)));
      }
      for (const sheet of data.sheets) {
        parts.push(el("h3", {}, bookName(sheet)));
        const rows = sheet.error ? [row({title: el("span", {className: "late"}, L("Cannot be read: ", "Не читается: ")
          + sheet.error), wrap: true})] : sheet.grades.length ? sheet.grades.map((g) => gradeRow(g, sheet))
          : [row({title: sheet.ok_at ? L("No grades yet", "Оценок пока нет") : L("Not read yet", "Ещё не прочитана"),
            className: "faded"})];
        rows.push(row({title: L("About the gradebook", "О таблице"), className: "more", go: () => openBook(sheet.id)}));
        parts.push(el("div", {className: "list"}, ...rows));
      }
      const courses = [...new Set(data.manual.map((g) => g.course))];
      for (const course of courses) {
        parts.push(el("h3", {}, course + L(" · added by you", " · добавлены вами")),
          el("div", {className: "list"}, ...data.manual.filter((g) => g.course === course).map((g) => gradeRow(g, null))));
      }
      if (!data.sheets.length && !data.manual.length) parts.push(empty(L("No grades yet.", "Оценок пока нет.")));
      parts.push(el("div", {className: "list", style: "margin-top: 22px"},
        button(L("Add a gradebook", "Добавить таблицу оценок"), () => push(gradesSettingsPage), {plus: true})));
      return parts;
    }

    function gradeCard(g, sheet) {
      const remove = () => change("api/grades/items/" + encodeURIComponent(g.id), "DELETE", undefined, "api/grades");
      openCard(cardHead(g.label, sheet ? bookName(sheet) : g.course),
        cardList(fact(L("Grade", "Оценка"), el("b", {}, gradeValue(g))),
          g.max && g.max !== 10 ? fact(L("Points", "Баллы"), `${g.raw} ${L("of", "из")} ${g.max}`) : null,
          g.edited ? fact(L("In the gradebook", "В таблице"), gradeMark(g.sheet_value)) : null,
          fact(L("From", "Откуда"), sheet ? bookName(sheet) : L("added by you", "добавлена вами"))),
        cardList(cardButton(L("Edit", "Изменить"), () => push(() => gradePage(g, sheet))),
          !sheet ? cardButton(L("Delete", "Удалить"), async () => {
            if (await askYes(L("Delete this grade?", "Удалить оценку?"))) remove();
          }, {danger: true}) : g.edited ? cardButton(L("Back to the gradebook's grade", "Вернуть оценку из таблицы"), remove,
            {danger: true}) : null),
        sheet ? cardFoot(L("A changed grade stays yours until the gradebook itself changes it.",
          "Изменённая оценка остаётся вашей, пока её не поменяют в самой таблице.")) : null);
    }

    // A grade added by hand, or one of them or of a sheet changed.
    async function gradePage(g, sheet) {
      const data = await get("api/grades");
      const courses = [...new Set([...data.manual.map((m) => m.course), ...data.sheets.map((s) => s.label).filter(Boolean)])];
      const course = input(g ? g.course : "", {maxLength: data.label_chars, placeholder: "Calc"});
      course.setAttribute("list", "courses");
      const label = input(g && g.label, {maxLength: 60, placeholder: L("Test 2", "Контрольная 2")});
      const value = input(g ? gradeMark(g.value) : "", {type: "number", min: 0, max: 10, step: 0.1, inputMode: "decimal",
        placeholder: "8"});
      const save = () => {
        const values = {label: label.value, value: Number(value.value)};
        if (!sheet) values.course = course.value;
        return g ? submit("api/grades/items/" + encodeURIComponent(g.id), "PATCH", values)
          : submit("api/grades/items", "POST", values);
      };
      return [el("h1", {className: "title"}, g ? L("Edit grade", "Изменить оценку") : L("New grade", "Новая оценка")),
        el("datalist", {id: "courses"}, ...courses.map((c) => el("option", {value: c}))),
        section(null, [sheet ? field(L("Gradebook", "Таблица"), el("span", {className: "grow"}, bookName(sheet)))
          : field(L("Course", "Предмет"), course), field(L("What", "За что"), label),
          field(L("Grade", "Оценка"), value)],
          L("On the 0–10 scale, as in Tablo and in the «Grades» topic.", "По шкале 0–10, как в Tablo и в теме «Оценки».")),
        primary(L("Save", "Сохранить"), save)];
    }

    // --- a gradebook: its name, a check, the markup of its tabs ----------------------------------------
    // Haiku marks up every tab: the header rows, the column of each graded work, its maximum and bonus column, its
    // label; a summary tab is skipped. Your own markup of a tab stands over Haiku's until you give the tab back.

    const bookPath = (id) => "api/grades/sheets/" + encodeURIComponent(id);
    const openBook = (id) => push(Object.assign(() => gradebookPage(id), {book: id}));

    async function gradebookPage(id) {
      const book = await get(bookPath(id));
      const name = input(book.name, {maxLength: 60, placeholder: book.title || L("Name", "Название")});
      name.onchange = () => change(bookPath(id), "PATCH", {name: name.value.trim()}, bookPath(id), "api/grades");
      const label = input(book.label, {maxLength: book.label_chars, placeholder: book.course});
      label.onchange = () => change(bookPath(id), "PATCH", {label: label.value.trim()}, bookPath(id), "api/grades");
      const read = async () => {
        await change(bookPath(id) + "/read", "POST", {}, bookPath(id));
        tell(L("Reading the gradebook: the result comes in a few seconds.",
          "Таблица читается: результат будет через несколько секунд."));
        setTimeout(() => { if (nav.stack.at(-1)?.book === id) { delete cache[bookPath(id)]; redraw(); } }, 5000);
      };
      const tabs = book.tabs.map((tab) => row({title: tab.tab, sub: tabSummary(tab),
        value: tab.by === "you" ? L("yours", "ваша") : null, go: () => push(Object.assign(() => tabPage(id, tab.tab),
        {book: id}))}));
      return [el("h1", {className: "title"}, bookName(book)),
        book.error ? notice(L("Cannot be read: ", "Не читается: ") + book.error) : null,
        section(null, [field(L("Name", "Название"), name), field(L("Course", "Курс"), label)],
          L(`The name is for this app; the course goes in front of every grade in Tablo and in the «Grades» topic, up `
            + `to ${book.label_chars} characters: «${book.course} HW 1».`, `Название — для этого приложения; курс стоит `
            + `перед каждой оценкой в Tablo и в теме «Оценки», до ${book.label_chars} символов: «${book.course} HW 1».`)),
        section(L("Check", "Проверка"), [
          fact(L("Read", "Прочитана"), book.ok_at ? when(book.ok_at) : L("not yet", "ещё нет")),
          fact(L("Looked up by", "Строка ищется по"), book.student || null),
          fact(L("Grades found", "Найдено оценок"), String(book.items)),
          button(L("Read now", "Прочитать сейчас"), read),
          button(L("Open in Google Sheets", "Открыть в Google Таблицах"), () => tg.openLink(book.url))],
          L("It is read every 30 minutes by itself.", "Сама таблица читается раз в 30 минут.")),
        section(L("Tabs", "Вкладки"), tabs.length ? tabs : [row({title: L("No tab with your row", "Нет вкладок с вашей строкой"),
          className: "faded"})], L("Tap a tab to see which columns are which works, and to correct it.",
          "Нажмите на вкладку, чтобы увидеть, какая колонка — какая работа, и поправить.")),
        el("div", {className: "list", style: "margin-top: 26px"}, button(L("Remove the gradebook", "Удалить таблицу"), async () => {
          if (!await askYes(L(`Remove «${bookName(book)}»? Its grades are forgotten; added again, its first reading is a `
            + "snapshot.", `Удалить «${bookName(book)}»? Её оценки забудутся; если добавить снова, первое чтение будет `
            + "снимком."))) return;
          const all = await get("api/grades");
          await submit("api/grades", "PATCH", {sheets: all.sheets.filter((s) => s.id !== id)
            .map((s) => ({url: s.url, label: s.label, name: s.name}))});
        }, {danger: true}))];
    }

    function tabSummary(tab) {
      if (tab.by === "failed") return el("span", {className: "late"}, L("Haiku could not mark it up", "Haiku не смогла разметить"));
      if (tab.skip) return L("skipped: ", "пропущена: ") + (tab.reason || L("no graded works", "нет оценок"));
      return count(tab.works.length, ["work", "works"], ["работа", "работы", "работ"]) + L(` · your row ${tab.own_row}`,
        ` · ваша строка ${tab.own_row}`);
    }

    // The owner's markup of a tab: what is sent replaces Haiku's.
    function saveTab(id, tab, works, skip = tab.skip) {
      return change(`${bookPath(id)}/tabs/${encodeURIComponent(tab.tab)}`, "PUT", {skip, works: works.map((w) =>
        ({column: w.column, label: w.label, max: w.max, bonus_column: w.bonus_column}))}, bookPath(id), "api/grades");
    }

    async function tabPage(id, name) {
      const book = await get(bookPath(id));
      const tab = book.tabs.find((t) => t.tab === name);
      if (!tab) return [empty(L("No such tab.", "Такой вкладки нет."))];
      const works = tab.works.map((w) => row({title: w.label,
        sub: L(`column ${w.column}`, `колонка ${w.column}`) + (w.header ? ` · «${w.header}»` : "")
          + (w.max !== 10 ? L(` · out of ${w.max}`, ` · из ${w.max}`) : "") + (w.bonus_column ? L(` · bonus ${w.bonus_column}`,
            ` · бонус ${w.bonus_column}`) : ""),
        value: w.raw === null ? "—" : w.max !== 10 ? `${w.raw} → ${gradeMark(w.value)}` : gradeMark(w.value),
        go: () => push(Object.assign(() => workPage(id, name, w), {book: id}))}));
      const free = tab.columns.filter((c) => !tab.works.some((w) => w.column === c.column));
      return [el("h1", {className: "title"}, tab.tab),
        el("p", {className: "subtitle"}, bookName(book) + " · " + (tab.by === "you" ? L("marked up by you", "размечена вами")
          : tab.by === "failed" ? L("not marked up", "не размечена") : L("marked up by Haiku", "размечена Haiku"))),
        section(null, [row({title: L("Read this tab", "Читать вкладку"), sub: tab.skip && tab.reason ? tab.reason : null,

            "Сбросить вашу разметку вкладки? Haiku разметит её заново при следующем чтении."))) {
            change(`${bookPath(id)}/tabs/${encodeURIComponent(tab.tab)}`, "DELETE", undefined, bookPath(id), "api/grades");

    // A work of a tab: which column, its label, its maximum, its bonus column; or a new one from a free column.
    async function workPage(id, name, work) {
      const book = await get(bookPath(id));
      const tab = book.tabs.find((t) => t.tab === name);
      const fresh = !work;
      const free = tab.columns.filter((c) => !tab.works.some((w) => w.column === c.column));
      let column = work ? work.column : free[0]?.column;
      const label = input(work && work.label, {maxLength: book.label_budget, placeholder: "HW 3"});
      const max = input(work ? work.max : 10, {type: "number", min: 1, step: "any", inputMode: "decimal"});
      let bonus = work && work.bonus_column || "";
      const describe = (c) => `${c.column} · ${c.header || "—"} · ${c.value}`;
      const others = tab.works.filter((w) => w !== work);
      return [el("h1", {className: "title"}, fresh ? L("Add a column", "Добавить колонку") : work.label),
        el("p", {className: "subtitle"}, `${bookName(book)} · ${tab.tab}`),
        section(null, [
          fresh ? field(L("Column", "Колонка"), selectOf(free.map((c) => [c.column, describe(c)]), column,
            (value) => { column = value; })) : fact(L("Column", "Колонка"), describe(tab.columns.find((c) => c.column === work.column)
              || {column: work.column, header: work.header, value: work.raw})),
          field(L("Label", "Название"), label), field(L("Out of", "Из"), max),
          field(L("Bonus", "Бонус"), selectOf([["", L("none", "нет")], ...tab.columns.filter((c) => c.column !== column)
            .map((c) => [c.column, describe(c)])], bonus, (value) => { bonus = value; }))],
          L(`The label goes after the course: «${book.course} ${work ? work.label : "HW 3"}», up to ${book.label_budget} `
            + "characters. «Out of»: the maximum points, the grade is turned to 0–10 by it.", `Название идёт после курса: `
            + `«${book.course} ${work ? work.label : "HW 3"}», до ${book.label_budget} символов. «Из» — максимум баллов, `
            + "по нему оценка переводится в 0–10.")),
        primary(L("Save", "Сохранить"), async () => {
          const edited = {column, label: label.value.trim(), max: Number(max.value) || 10, bonus_column: bonus || null};
          await saveTab(id, tab, fresh ? [...tab.works, edited] : tab.works.map((w) => w === work ? edited : w));
          back();
        }),
        fresh ? null : el("div", {className: "list", style: "margin-top: 24px"}, button(L("Not a grade", "Это не оценка"),
          async () => { await saveTab(id, tab, others); back(); }, {danger: true}))];
    }

        + "version replaces the file in the old message.", "PDF с заданиями; бот присылает их в тему «Листочки», новая "
        + "версия заменяет файл в старом сообщении.")));
      return parts;
    }

    // The sheets posted before this one that it may be a new version of.
    function olderSheets(sheet, data) {
      if (sheet.status !== "posted" || sheet.versions !== 1 || !sheet.file) return [];
      return data.sheets.filter((other) => other.status === "posted" && other.first !== sheet.first
        && other.created_at <= sheet.created_at);
    }

    function sheetCard(sheet, data) {
      const older = olderSheets(sheet, data);
      openCard(cardHead(sheetTitle(sheet), sheet.name),
        sheet.summary ? el("div", {className: "list"}, el("div", {className: "text"}, sheet.summary)) : null,
        cardList(fact(L("Due", "Срок"), sheet.due ? dayLabel(sheet.due) : null),
          fact(L("Versions", "Версий"), sheet.versions > 1 ? String(sheet.versions) : null),
          fact(L("From", "Откуда"), sheet.own ? L("added by you", "добавлен вами") : sheet.chat),
          fact(L("Received", "Получен"), when(sheet.created_at)),
          sheet.status === "failed" ? fact(L("Not posted", "Не отправлен"), el("span", {className: "late"}, sheet.error))
            : null,
          sheet.status === "new" ? fact(L("State", "Состояние"), L("waiting for the forum", "ждёт отправки в форум")) : null),
        cardList(cardButton(L("Edit", "Изменить"), () => push(() => sheetEditPage(sheet))),
          older.length ? cardButton(L("It is a new version of another sheet…", "Это новая версия другого листка…"),

    function sheetFields(sheet) {
      const course = input(sheet && (sheet.title || sheet.course), {maxLength: 40, placeholder: "Calculus"});
      const number = input(sheet && sheet.number, {maxLength: 10, placeholder: "5", inputMode: "numeric"});
      const due = input(sheet && sheet.due, {type: "date"});

    function sheetEditPage(sheet) {

        primary(L("Save", "Сохранить"), () => submit("api/sheets/" + sheet.id, "PATCH", {course: f.course.value,
          number: f.number.value, due: f.due.value || null, summary: summary.value}))];

    function sheetNewPage() {
      const f = sheetFields(null);
      const file = el("input", {type: "file", accept: "application/pdf", className: "grow"});
      return [el("h1", {className: "title"}, L("New sheet", "Новый листочек")),
        section(null, [field("PDF", file), ...f.rows],
          L("The bot posts it to the «Sheets» topic as one from a chat. Only your own sheets can be deleted.",

    function joinPage(sheet, older) {
      return [el("h1", {className: "title"}, L("A new version of…", "Новая версия…")),
        el("p", {className: "subtitle"}, `${sheetTitle(sheet)} · ${sheet.name}`),

      const found = [];

      if (twin && !twin.account) found.push([L("The twin is not logged in: no chat is read", "Твинк не вошёл: чаты не читаются"), chatsPage]);
      else if (twin && twin.error) found.push([L("The twin: ", "Твинк: ") + twin.error, chatsPage]);
      if (list && list.mail && list.mail.configured && list.mail.error) {
        found.push([L("The mail is not read: ", "Почта не читается: ") + list.mail.error, null]);
      }
      if (deadlines && deadlines.hseapp.login_needed) found.push([L("HSE App X needs a login", "HSE App X: нужен вход"), hsePage]);
      if (agenda && agenda.ruz.error) found.push([L("RUZ is not read: ", "РУЗ не читается: ") + agenda.ruz.error, null]);
      if (agenda && !agenda.calendar) {
        found.push([L("The iCal feeds are off: set CALENDAR_SECRET or CALENDAR_PUBLIC_SECRET in .env",
          "Ленты iCal выключены: задайте CALENDAR_SECRET или CALENDAR_PUBLIC_SECRET в .env"), null]);
      }
      for (const sheet of grades ? grades.sheets : []) {
        if (sheet.error) {
          found.push([L("A gradebook is not read: ", "Таблица оценок не читается: ") + (sheet.title || sheet.label
            || L("untitled", "без названия")), gradesSettingsPage]);

      if (list && list.images && list.images.error) {
        found.push([L("Reading images failed: ", "Чтение картинок не удалось: ") + list.images.error, imagesPage]);

    }

    // --- the twin and the chats ------------------------------------------------------------------

    let chatQuery = "";

    async function chatsPage() {
      const list = await get("api/chats");
      const parts = [el("h1", {className: "title"}, L("Twin and chats", "Твинк и чаты"))];
      if (list.twin) parts.push(twinSection(list.twin));
      if (list.chats.length >= 8) {
        const search = el("input", {className: "search", type: "search", value: chatQuery,
          placeholder: L("Find a chat", "Найти чат")});
        search.oninput = () => { chatQuery = search.value; drawChatList(list); };
        parts.push(el("div", {style: "margin-top: 22px"}, search));
      }
      parts.push(el("div", {id: "chat-list"}, ...chatListParts(list)));
      return parts;
    }

    function drawChatList(list) {
      $("chat-list").replaceChildren(...chatListParts(list).flat());
    }

    function chatListParts(list) {
      const query = chatQuery.trim().toLowerCase();
      const shown = list.chats.filter((chat) => chat.title.toLowerCase().includes(query));
      const parts = [];
      for (const [title, enabled, foot] of [[L("Read", "Читаются"), true, L("Tap a chat to set it up.",
        "Нажмите на чат, чтобы настроить его.")], [L("Off", "Выключены"), false,
        L("A new chat comes switched off.", "Новый чат появляется выключенным.")]]) {
        const part = shown.filter((chat) => chat.settings.enabled === enabled);
        if (part.length) parts.push(...section(`${title} · ${part.length}`, part.map((chat) => chatRow(chat, list)), foot));
      }
      if (!shown.length) parts.push(empty(list.chats.length ? L("Nothing found.", "Ничего не нашлось.") :
        L("No chats yet: they come when the twin logs in to Telegram.",
          "Чатов пока нет: они появятся, когда твинк войдёт в Telegram.")));
      return parts;
    }

    function chatFacts(chat) {
      const facts = [KINDS()[chat.kind] || chat.kind];
      if (chat.settings.study) facts.push(L("study", "учебный"));
      if (chat.settings.filter === "important") facts.push(L("important only", "только важное"));
      return facts.join(" · ");
    }

    function chatRow(chat, list) {
      const node = row({title: chat.title, sub: chatFacts(chat), control: toggle(chat.settings.enabled, async (on) => {
        try {
          chat.settings = await send("api/chats/" + chat.id, "PATCH", {enabled: on});
        } catch (error) {
          tell(error.message);
        }
        drawChatList(list);
      })});
      node.classList.add("tap");
      node.onclick = () => push(() => chatPage(chat.id));
      node.querySelector(".switch").onclick = (event) => event.stopPropagation();
      return node;
    }

    async function chatPage(chatId) {
      const list = await get("api/chats");
      const chat = list.chats.find((c) => c.id === chatId);
      if (!chat) return [empty(L("No such chat.", "Такого чата нет."))];
      const senders = await get(`api/chats/${chat.id}/senders`);
      const s = chat.settings;
      const change = async (values) => {
        try {
          chat.settings = await send("api/chats/" + chat.id, "PATCH", values);
        } catch (error) {
          tell(error.message);
        }
        redraw();
      };
      const people = senders.map((sender) => row({title: sender.name || `id ${sender.id}`,
        sub: sender.messages ? L("messages: ", "сообщений: ") + sender.messages : L("has not written yet", "ещё не писал"),
        control: toggle(s.people.includes(sender.id), (on) => change({people: on ? [...s.people, sender.id] :
          s.people.filter((id) => id !== sender.id)}))}));
      return [el("h1", {className: "title"}, chat.title),
        el("p", {className: "subtitle"}, [KINDS()[chat.kind] || chat.kind, chat.username ? "@" + chat.username : "",
