<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>infomaster</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    body {
      margin: 0;
      padding: 16px;
      font: 16px/1.4 -apple-system, system-ui, sans-serif;
      background: var(--tg-theme-bg-color, #fff);
      color: var(--tg-theme-text-color, #000);
    }
    h2 { margin: 0 0 4px; }
    h3 { margin: 20px 0 6px; font-size: 13px; text-transform: uppercase; color: var(--tg-theme-section-header-text-color, #888); }
    .hint { color: var(--tg-theme-hint-color, #888); font-size: 14px; }
    .card {
      margin-top: 12px;
      padding: 12px 16px;
      border-radius: 12px;
      background: var(--tg-theme-secondary-bg-color, #f2f2f2);
    }
    .warn { color: var(--tg-theme-destructive-text-color, #d33); }
    input[type=search] {
      box-sizing: border-box;
      width: 100%;
      margin-top: 12px;
      padding: 8px 12px;
      border: 0;
      border-radius: 10px;
      font: inherit;
      background: var(--tg-theme-secondary-bg-color, #f2f2f2);
      color: inherit;
    }
    .list { border-radius: 12px; overflow: hidden; background: var(--tg-theme-secondary-bg-color, #f2f2f2); }
    .row {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 16px;
      border-bottom: 1px solid var(--tg-theme-bg-color, #fff);
    }
    .row:last-child { border-bottom: 0; }
    .row .main { flex: 1; min-width: 0; cursor: pointer; }
    .row .title { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    select { font: inherit; color: inherit; background: transparent; border: 0; text-align: right; }
    .switch { position: relative; width: 44px; height: 26px; flex: none; }
    .switch input { opacity: 0; width: 0; height: 0; }
    .switch span {
      position: absolute;
      inset: 0;
      border-radius: 13px;
      background: var(--tg-theme-hint-color, #bbb);
      transition: background .15s;
    }
    .switch span::after {
      content: "";
      position: absolute;
      top: 3px;
      left: 3px;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: #fff;
      transition: transform .15s;
    }
    .switch input:checked + span { background: var(--tg-theme-button-color, #2481cc); }
    .switch input:checked + span::after { transform: translateX(18px); }
    .tabs { display: flex; gap: 6px; margin-top: 12px; overflow-x: auto; }
    .tabs button {
      flex: 1 0 auto;
      padding: 8px 10px;
      white-space: nowrap;
      border: 0;
      border-radius: 10px;
      font: inherit;
      font-size: 15px;
      background: var(--tg-theme-secondary-bg-color, #f2f2f2);
      color: inherit;
    }
    .tabs button.on {
      background: var(--tg-theme-button-color, #2481cc);
      color: var(--tg-theme-button-text-color, #fff);
    }
    .list + .list { margin-top: 8px; }
    .badge { font-size: 13px; color: var(--tg-theme-link-color, #2481cc); }
    .struck { text-decoration: line-through; }
    .faded { opacity: .5; }
    label.field { display: block; margin-top: 12px; }
    label.field input {
      box-sizing: border-box;
      width: 100%;
      margin-top: 4px;
      padding: 8px 12px;
      border: 0;
      border-radius: 10px;
      font: inherit;
      background: var(--tg-theme-secondary-bg-color, #f2f2f2);
      color: inherit;
    }
    label.field input:read-only { opacity: .6; }
    .actions { display: flex; gap: 8px; margin-top: 16px; }
    .actions button {
      flex: 1;
      padding: 10px 0;
      border: 0;
      border-radius: 10px;
      font: inherit;
      background: var(--tg-theme-button-color, #2481cc);
      color: var(--tg-theme-button-text-color, #fff);
    }
    .actions button.danger {
      background: var(--tg-theme-secondary-bg-color, #f2f2f2);
      color: var(--tg-theme-destructive-text-color, #d33);
    }
    a { color: var(--tg-theme-link-color, #2481cc); }
    .actions button:disabled { opacity: .5; }
    details.card summary { cursor: pointer; color: var(--tg-theme-link-color, #2481cc); }
    textarea {
      box-sizing: border-box;
      width: 100%;
      margin-top: 8px;
      padding: 8px 12px;
      border: 0;
      border-radius: 10px;
      font: 14px/1.4 ui-monospace, monospace;
      background: var(--tg-theme-bg-color, #fff);
      color: inherit;
      resize: vertical;
    }
    .ok { color: var(--tg-theme-link-color, #2481cc); }
    .row button.small {
      flex: none;
      padding: 6px 10px;
      border: 0;
      border-radius: 8px;
      font: inherit;
      font-size: 14px;
      background: var(--tg-theme-bg-color, #fff);
      color: var(--tg-theme-link-color, #2481cc);
    }
    label.field select {
      display: block;
      box-sizing: border-box;
      width: 100%;
      margin-top: 4px;
      padding: 8px 12px;
      border-radius: 10px;
      text-align: left;
      background: var(--tg-theme-secondary-bg-color, #f2f2f2);
    }
    label.field select:disabled { opacity: .6; }
    .card label.field input { background: var(--tg-theme-bg-color, #fff); }
    #llm { display: flex; justify-content: space-between; gap: 8px; cursor: pointer; }
    #llm[hidden] { display: none; }
    .periods { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; margin-top: 12px; }
    .periods button {
      padding: 10px;
      border: 2px solid transparent;
      border-radius: 12px;
      font: inherit;
      text-align: left;
      background: var(--tg-theme-secondary-bg-color, #f2f2f2);
      color: inherit;
    }
    .periods button.on { border-color: var(--tg-theme-button-color, #2481cc); }
    .periods .sum { font-size: 20px; font-weight: 600; }
    .periods .hint { font-size: 12px; }
    .chart { display: block; width: 100%; height: 120px; }
    .chart .bar { fill: var(--tg-theme-button-color, #2481cc); opacity: .45; }
    .chart .bar.today { opacity: 1; }
    .chart .bar.stopped { fill: var(--tg-theme-destructive-text-color, #d33); opacity: 1; }
    .chart .bar.picked { opacity: 1; }
    .chart .limit { stroke: var(--tg-theme-destructive-text-color, #d33); stroke-dasharray: 4 3; stroke-width: 1; }
    .chart .tap { fill: transparent; cursor: pointer; }
    .share { height: 4px; margin-top: 4px; border-radius: 2px; background: var(--tg-theme-bg-color, #fff); }
    .share i { display: block; height: 100%; border-radius: 2px; background: var(--tg-theme-button-color, #2481cc); }
    .money { white-space: nowrap; text-align: right; }
    .row input[type=number] {
      width: 80px;
      padding: 4px 8px;
      border: 0;
      border-radius: 8px;
      font: inherit;
      text-align: right;
      background: var(--tg-theme-bg-color, #fff);
      color: inherit;
    }
    .row button.link { border: 0; padding: 0; font: inherit; background: none; color: var(--tg-theme-link-color, #2481cc); }
  </style>
</head>
<body>
  <div id="home">
    <h2 id="title">infomaster</h2>
    <p id="state" class="hint">…</p>
    <div id="llm" class="card" hidden></div>
    <nav id="tabs" class="tabs" hidden></nav>
    <section id="tab-chats">
      <p id="chats-hint" class="hint"></p>
      <div id="twin" class="card" hidden></div>
      <div id="mail" class="card" hidden></div>
      <input id="search" type="search" hidden>
      <div id="chats"></div>
      <div id="images"></div>
    </section>
    <section id="tab-schedule" hidden></section>
    <section id="tab-deadlines" hidden></section>
    <section id="tab-sheets" hidden></section>
    <section id="tab-grades" hidden></section>
    <section id="tab-summaries" hidden></section>
    <section id="tab-subjects" hidden>
      <p id="subjects-hint" class="hint"></p>
      <div id="subjects-error" class="card warn" hidden></div>
      <input id="subject-search" type="search">
      <div class="actions"><button id="subject-add"></button></div>
      <div id="subjects"></div>
    </section>
    <section id="tab-hseapp" hidden></section>
    <section id="tab-llm" hidden></section>
    <section id="tab-general" hidden></section>
  </div>
  <div id="chat" hidden></div>
  <div id="subject" hidden></div>
  <div id="deadline" hidden></div>

  <script>
    const tg = window.Telegram.WebApp;
    tg.ready();
    const $ = (id) => document.getElementById(id);
    // The Mini App's language (р. 41): English until /api/me tells the setting; every text is L(english, russian).
    let lang = "en";
    const L = (en, ru) => lang === "ru" ? ru : en;
    const LANGUAGE_NAMES = {en: "English", ru: "Русский"};  // each in its own language
    const TABS = [["chats", "Chats", "Чаты"], ["schedule", "Timetable", "Расписание"], ["deadlines", "Deadlines", "Дедлайны"],
                  ["sheets", "Sheets", "Листочки"], ["grades", "Grades", "Оценки"], ["summaries", "Summaries", "Сводки"],
                  ["subjects", "Dictionary", "Словарь"], ["hseapp", "HSE App X", "HSE App X"],
                  ["llm", "LLM spending", "Расход LLM"], ["general", "General", "Общие"]];
    const KINDS = () => L({user: "private", bot: "bot", group: "group", supergroup: "supergroup", forum: "forum",
                           channel: "channel"},
                          {user: "личный", bot: "бот", group: "группа", supergroup: "супергруппа", forum: "форум",
                           channel: "канал"});
    // The settings of a chat (§5.1), in the order of the screen.
    const FLAGS = () => [
      ["study", L("Study", "Учебный"), L("news rank, deadlines", "ранг новостей, дедлайны")],
      ["urgent", L("Urgent", "Срочно"), L("a pin, a PDF or a message of an important person: parsed at once",
                                          "закреп, PDF или сообщение важного человека — разбор сразу")],
      ["summary", L("Summary", "Сводка"), L("in the daily summary", "включать в ежедневную сводку")],
      ["images", L("Images", "Картинки"), L("Haiku reads photos and screenshots, within the images a day",
                                            "фото и скриншоты читает Haiku, в пределах числа картинок в день")],
      ["pdf_content", L("Whole PDF", "PDF целиком"),
       L("sheets: a summary, deadlines from every page, what changed",
         "листочки: краткое содержание, дедлайны со всех страниц, что изменилось")],
    ];
    const BATCH_HOURS = [1, 2, 3, 4, 6, 8, 12, 24];
    const WEEKDAYS = () => L(["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"], ["вс", "пн", "вт", "ср", "чт", "пт", "сб"]);
    const TYPES_RU = {Lecture: "лекция", Seminar: "семинар", Consultation: "консультация", Event: "событие",
                      "Interim assessment": "рубежный контроль", Exam: "экзамен", Lab: "лабораторная", Class: "занятие"};
    let chats = [];
    let dictionary = {subjects: [], error: null, title_chars: 13, abbr_chars: 6};
    let opened = null;  // the detail view the back button closes

    async function call(path, options = {}) {
      const response = await fetch(path, {...options, headers: {...options.headers,
        Authorization: "tma " + tg.initData}});
      if (response.status === 401) throw new Error(L("Open the app from the bot.", "Откройте приложение из бота."));
      if (response.status === 403) throw new Error(L("No access.", "Нет доступа."));
      if (!response.ok) throw new Error(await response.text() || L("Error ", "Ошибка ") + response.status);
      return response.json();
    }

    function send(path, method, values) {
      return call(path, {method, body: JSON.stringify(values), headers: {"Content-Type": "application/json"}});
    }

    async function save(chat, values) {
      try {
        chat.settings = await send("api/chats/" + chat.id, "PATCH", values);
      } catch (error) {
        tg.showAlert(error.message);
      }
      return chat.settings;
    }

    function el(tag, props = {}, ...children) {
      const node = Object.assign(document.createElement(tag), props);
      node.append(...children);
      return node;
    }

    function toggle(checked, onchange) {
      const input = el("input", {type: "checkbox", checked});
      input.onchange = () => onchange(input.checked);
      return el("label", {className: "switch"}, input, el("span"));
    }

    function settingRow(title, hint, control) {
      return el("div", {className: "row"},
        el("div", {className: "main"}, el("div", {}, title), hint ? el("div", {className: "hint"}, hint) : ""),
        control);
    }

    // The texts of the page itself: the tabs, the hints and fields of the screens that are not drawn by a render.
    function applyLanguage() {
      document.documentElement.lang = lang;
      $("tabs").replaceChildren(...TABS.map(([name, en, ru]) => {
        const button = el("button", {}, L(en, ru));
        button.dataset.tab = name;
        button.onclick = () => showTab(name);
        return button;
      }));
      $("chats-hint").textContent = L("The twin's chats and their settings. A new chat comes switched off.",
        "Чаты твинка и их настройки. Новый чат появляется выключенным.");
      $("search").placeholder = L("Find a chat", "Найти чат");
      $("subjects-hint").textContent = L("How the courses are named in the timetable, the feed and the deadlines. "
        + "Haiku never changes a manual entry; a deleted entry Haiku names again.",
        "Как курсы называются в расписании, ленте и дедлайнах. Ручные записи Haiku не меняет; удалённую запись Haiku "
        + "назовёт заново.");
      $("subject-search").placeholder = L("Find a course", "Найти курс");
      $("subject-add").textContent = L("Add an entry", "Добавить запись");
    }

    // --- the list -------------------------------------------------------------

    function renderList() {
      const query = $("search").value.trim().toLowerCase();
      const shown = chats.filter((chat) => chat.title.toLowerCase().includes(query));
      const box = $("chats");
      box.replaceChildren();
      for (const [title, enabled] of [[L("On", "Включены"), true], [L("Off", "Выключены"), false]]) {
        const part = shown.filter((chat) => chat.settings.enabled === enabled);
        if (!part.length) continue;
        box.append(el("h3", {}, `${title} · ${part.length}`), el("div", {className: "list"}, ...part.map(chatRow)));
      }
      if (!shown.length) box.append(el("p", {className: "hint"}, chats.length ? L("Nothing found.", "Ничего не нашлось.") :
        L("No chats yet: they come when the twin logs in to Telegram.",
          "Чатов пока нет: они появятся, когда твинк войдёт в Telegram.")));
    }

    function chatRow(chat) {
      const facts = [KINDS()[chat.kind] || chat.kind];
      if (chat.settings.study) facts.push(L("study", "учебный"));
      if (chat.settings.filter === "important") facts.push(L("important only", "только важное"));
      if (chat.messages) facts.push(L("messages: ", "сообщений: ") + chat.messages);
      const main = el("div", {className: "main"}, el("div", {className: "title"}, chat.title),
        el("div", {className: "hint"}, facts.join(" · ")));
      main.onclick = () => openChat(chat);
      return el("div", {className: "row"}, main,
        toggle(chat.settings.enabled, async (on) => { await save(chat, {enabled: on}); renderList(); }));
    }

    // The daily number of images read in chats with «Images» (р. 12), under the list.
    function renderImages(state) {
      if (!state || state.daily === undefined) return;
      const input = el("input", {type: "number", value: state.daily, min: 0, max: 500, step: 1, inputMode: "numeric"});
      input.style.width = "90px";
      input.style.textAlign = "right";
      input.onchange = async () => {
        try {
          renderImages(await send("api/images", "PATCH", {daily: Number(input.value)}));
        } catch (error) {
          tg.showAlert(error.message);
          input.value = state.daily;
        }
      };
      const parts = [el("h3", {}, L("Images", "Картинки")),
        el("p", {className: "hint"}, L("In chats with «Images» Haiku reads photos and screenshots before they are "
          + "parsed. Above 80 % of the LLM limit and past the number a day images are not read.",
          "В чатах с «Картинки» фото и скриншоты читает Haiku, прежде чем их разберут. "
          + "Выше 80 % лимита LLM и сверх числа в день картинки не читаются.")),
        el("div", {className: "list"}, settingRow(L("A day", "В день"),
          L("read today: ", "сегодня прочитано: ") + state.today, input))];
      if (state.error) {
        parts.splice(2, 0, el("div", {className: "card warn"},
          L("Reading images failed: ", "Чтение картинок не удалось: ") + state.error));
      }
      $("images").replaceChildren(...parts);
    }

    // --- one chat -------------------------------------------------------------

    function openView(view) {
      $("home").hidden = true;
      $(view).hidden = false;
      opened = view;
      tg.BackButton.show();
      window.scrollTo(0, 0);
    }

    function back() {
      if (opened) $(opened).hidden = true;
      opened = null;
      $("home").hidden = false;
      tg.BackButton.hide();
      renderList();
      renderSubjects();
      if (!$("tab-summaries").hidden) loadSummaries();  // a chat's «Summary» may have changed
    }

    async function openChat(chat) {
      openView("chat");
      renderChat(chat, null);
      try {
        renderChat(chat, await call(`api/chats/${chat.id}/senders`));
      } catch (error) {
        tg.showAlert(error.message);
      }
    }

    function renderChat(chat, senders) {
      const s = chat.settings;
      const rerender = async (values) => { await save(chat, values); renderChat(chat, senders); };

      const filter = el("select", {}, el("option", {value: "all"}, L("all messages", "все сообщения")),
        el("option", {value: "important"}, L("important only", "только важное")));
      filter.value = s.filter;
      filter.onchange = () => rerender({filter: filter.value});

      const batch = el("select", {}, el("option", {value: ""}, L("general", "общий")),
        ...BATCH_HOURS.map((h) => el("option", {value: h}, L(`every ${h} h`, `каждые ${h} ч`))));
      batch.value = s.batch_hours ?? "";
      batch.onchange = () => rerender({batch_hours: batch.value ? Number(batch.value) : null});

      const settings = el("div", {className: "list"},
        settingRow(L("Read the chat", "Читать чат"), L("its messages go to the base", "сообщения попадают в базу"),
          toggle(s.enabled, (on) => rerender({enabled: on}))),
        ...FLAGS().map(([name, title, hint]) => settingRow(title, hint,
          toggle(s[name], (on) => rerender({[name]: on})))),
        settingRow(L("Filter", "Фильтр"), L("important: the listed people, pins, files, dates and the replies to them",
          "важное: люди из списка, закрепы, файлы, даты и ответы на них"), filter),
        settingRow(L("Parsing", "Разбор"), L("how often its batch is parsed", "как часто разбирать пачку"), batch));

      const people = el("div", {className: "list"});
      if (senders === null) {
        people.append(el("div", {className: "row hint"}, L("Loading…", "Загрузка…")));
      } else if (!senders.length) {
        people.append(el("div", {className: "row hint"}, L("Nobody has written yet: the list comes from the messages.",
          "Пока никто не писал: список соберётся из сообщений.")));
      }
      for (const sender of senders || []) {
        const chosen = s.people.includes(sender.id);
        people.append(settingRow(sender.name || `id ${sender.id}`,
          sender.messages ? L("messages: ", "сообщений: ") + sender.messages : L("has not written yet", "ещё не писал"),
          toggle(chosen, (on) => rerender({people: on ? [...s.people, sender.id] :
            s.people.filter((id) => id !== sender.id)}))));
      }

      $("chat").replaceChildren(
        el("h2", {}, chat.title),
        el("p", {className: "hint"}, [KINDS()[chat.kind] || chat.kind, chat.username ? "@" + chat.username : ""]
          .filter(Boolean).join(" · ")),
        settings,
        el("h3", {}, L("Important people", "Важные люди")),
        el("p", {className: "hint"}, L("For the «important only» filter and for «Urgent»: the group head, the teachers.",
          "Для фильтра «только важное» и для «срочно»: староста, преподаватели.")),
        people);
    }

    // --- the timetable ------------------------------------------------------

    function when(start, end) {
      const day = new Date(start.slice(0, 10) + "T00:00:00");
      let text = `${WEEKDAYS()[day.getDay()]} ${start.slice(8, 10)}.${start.slice(5, 7)} ${start.slice(11, 16)}`;
      if (end && end.slice(0, 10) === start.slice(0, 10)) text += "–" + end.slice(11, 16);
      return text;
    }

    function room(value) {
      if (!value) return "";
      return /^https?:\/\//.test(value) ? L("link", "ссылка") : value === "online" ? L("online", "онлайн") : value;
    }

    async function loadSchedule() {
      try {
        renderSchedule(await call("api/schedule"));
      } catch (error) {
        $("tab-schedule").replaceChildren(el("p", {className: "hint"}, error.message));
      }
    }

    async function changeEvent(event, values) {
      try {
        renderSchedule(await send("api/events/" + event.id, "PATCH", values));
      } catch (error) {
        tg.showAlert(error.message);
        loadSchedule();
      }
    }

    function renderSchedule(data) {
      const box = $("tab-schedule");
      const ruz = data.ruz;
      const parts = [el("p", {className: "hint"}, L("Events from the chats and corrections of classes from today on. "
        + "The main calendar is where to be, the optional one where one may come; what is hidden leaves the feeds.",
        "События из чатов и правки пар с сегодняшнего дня. Основной календарь — где нужно быть, необязательный — куда "
        + "можно прийти; скрытое пропадает из лент."))];
      if (ruz.error) {
        parts.push(el("div", {className: "card warn"}, L("RUZ: ", "РУЗ: ") + ruz.error));
      } else {
        parts.push(el("div", {className: "card"}, L(`RUZ: ${ruz.classes} classes`, `РУЗ: ${ruz.classes} пар`) +
          (ruz.ok_at ? L(", updated ", ", обновлено ") + when(ruz.ok_at) : "")));
      }
      if (ruz.subjects_error) {
        parts.push(el("div", {className: "card warn"}, L("The course titles wait for Haiku: ",
          "Названия предметов ждут Haiku: ") + ruz.subjects_error));
      }
      if (!data.calendar) {
        parts.push(el("div", {className: "card warn"}, L("The iCal feeds are off: set CALENDAR_SECRET in .env.",
          "Ленты iCal выключены: задайте CALENDAR_SECRET в .env.")));
      }
      if (!data.events.length) {
        parts.push(el("p", {className: "hint"}, L("No events from the chats or corrections of classes ahead.",
          "Впереди нет событий из чатов и правок пар.")));
      }
      for (const event of data.events) parts.push(eventCard(event));
      box.replaceChildren(...parts);
    }

    function eventCard(event) {
      const facts = [];
      if (event.correction) {
        facts.push(event.cancelled ? L("cancelled: ", "отмена: ") + when(event.class.start, event.class.end) :
          `${when(event.class.start, event.class.end)} → ${when(event.start, event.end)}`);
      } else {
        facts.push(when(event.start, event.end));
      }
      if (room(event.room)) facts.push(room(event.room));
      facts.push(L(event.type.toLowerCase(), TYPES_RU[event.type] || event.type.toLowerCase()));
      if (event.cancelled && !event.correction) facts.push(L("cancelled", "отменено"));
      const source = event.link ? el("a", {href: event.link}, event.chat || L("message", "сообщение")) : (event.chat || "");
      if (event.link) {
        source.onclick = (click) => {  // a t.me link opens in Telegram itself, not in a browser
          click.preventDefault();
          if (event.link.startsWith("https://t.me/")) tg.openTelegramLink(event.link); else tg.openLink(event.link);
        };
      }
      const title = el("div", {className: "title" + (event.cancelled ? " struck" : "")},
        (event.correction ? L("Class: ", "Пара: ") : "") + event.title);
      const main = el("div", {className: "main" + (event.hidden ? " faded" : "")}, title,
        el("div", {className: "hint"}, facts.join(" · ")), el("div", {className: "hint"}, source));
      const card = el("div", {className: "list"}, el("div", {className: "row"}, main));
      if (event.correction) {
        card.append(settingRow(L("Apply the correction", "Применять правку"),
          L("switch it off if the model was wrong: the class is as RUZ has it",
            "выключите, если модель ошиблась: пара будет как в РУЗ"),
          toggle(!event.hidden, (on) => changeEvent(event, {hidden: !on}))));
        return card;
      }
      if (!event.cancelled) {
        card.append(settingRow(L("Main calendar", "Основной календарь"),
          event.required ? L("must be there", "нужно быть") : L("may come", "можно прийти"),
          toggle(event.required, (on) => changeEvent(event, {required: on}))));
      }
      card.append(settingRow(L("In the calendars", "В календарях"), event.hidden ? L("hidden", "скрыто") : "",
        toggle(!event.hidden, (on) => changeEvent(event, {hidden: !on}))));
      return card;
    }

    // --- deadlines -----------------------------------------------------------

    const SOURCES = () => L({hseapp: "HSE App X", ical: "RUZ", mail: "mail", tg: "chat", ha: "own"},
                            {hseapp: "HSE App X", ical: "РУЗ", mail: "почта", tg: "чат", ha: "свой"});
    const CATEGORIES = () => L({study: "study", personal: "personal"}, {study: "учёба", personal: "личное"});
    let deadlineState = null;

    function dayLabel(iso) {
      const date = new Date(iso + "T00:00:00");
      return `${WEEKDAYS()[date.getDay()]} ${iso.slice(8, 10)}.${iso.slice(5, 7)}`;
    }

    // The mark of the pinned list in the forum; `today` is the service's, a Moscow date.
    function dueMark(iso, today) {
      const days = Math.round((new Date(iso + "T00:00:00") - new Date(today + "T00:00:00")) / 86400000);
      if (days < 0) return L("overdue", "просрочен") + ` (${dayLabel(iso)})`;
      if (days === 0) return L("today", "сегодня");
      if (days === 1) return L("tomorrow", "завтра");
      return dayLabel(iso);
    }

    async function loadDeadlines() {
      try {
        renderDeadlines(await call("api/deadlines"));
      } catch (error) {
        $("tab-deadlines").replaceChildren(el("p", {className: "hint"}, error.message));
      }
    }

    async function changeDeadlines(path, method, values) {

        renderDeadlines(await send(path, method, values));
        return true;
      } catch (error) {
        tg.showAlert(error.message);
        return false;
      }
    }

    function renderDeadlines(data) {
      deadlineState = data;
      const parts = [el("p", {className: "hint"}, L("Every deadline after the merge: Tablo, HA's to-do lists and the "
        + "pinned list of the «Deadlines» topic see the same list. A hidden one never comes back, even if its source "
        + "sends it again.",
        "Все дедлайны после склейки: тот же список видят Tablo, списки дел HA и закреп в теме «Дедлайны». Скрытый не "
        + "вернётся, даже если источник пришлёт его снова."))];
      if (data.hseapp.login_needed) {
        parts.push(el("div", {className: "card warn"}, L("HSE App X: a login is needed, its deadlines are not updated "
          + "(the «HSE App X» screen).", "HSE App X: нужен вход, дедлайны оттуда не обновляются (экран «HSE App X»).")));
      }
      parts.push(el("h3", {}, L("On the list · ", "В списке · ") + data.items.length), data.items.length ?
        el("div", {className: "list"}, ...data.items.map(deadlineRow)) :
        el("p", {className: "hint"}, L("No deadlines.", "Дедлайнов нет.")));
      parts.push(el("h3", {}, L("Own · ", "Свои · ") + data.own.length));
      if (data.own.length) parts.push(el("div", {className: "list"}, ...data.own.map(ownRow)));
      const add = el("button", {}, L("Add one", "Добавить свой"));

      parts.push(el("div", {className: "actions"}, add));
      if (data.hidden.length) {
        parts.push(el("h3", {}, L("Hidden · ", "Скрытые · ") + data.hidden.length),

      }
      $("tab-deadlines").replaceChildren(...parts);
    }

    function deadlineRow(d) {
      const facts = [dueMark(d.due, deadlineState.today), SOURCES()[d.source] || d.source];
      if (d.course) facts.push(d.course);
      if (d.category === "personal") facts.push(CATEGORIES().personal);
      const main = el("div", {className: "main"}, el("div", {className: "title"}, d.title),
        el("div", {className: "hint" + (d.overdue ? " warn" : "")}, facts.join(" · ")));
      const row = el("div", {className: "row"}, main);
      if (d.source === "ha") {
        main.onclick = () => openDeadline(deadlineState.own.find((own) => own.uid === d.uid) || d);
        return row;
      }
      const hide = el("button", {className: "small"}, L("Hide", "Скрыть"));
      hide.onclick = () => tg.showConfirm(L(`Hide «${d.title}»? It never comes back, even if its source sends it `
        + "again. It can be restored below, in «Hidden».", `Скрыть «${d.title}»? Он не вернётся, даже если источник `
        + "пришлёт его снова. Вернуть можно ниже, в «Скрытых»."), (yes) => {
        if (yes) changeDeadlines("api/deadlines/" + encodeURIComponent(d.uid), "DELETE");
      });
      row.append(hide);
      return row;
    }

    function ownRow(d) {
      const main = el("div", {className: "main"}, el("div", {className: "title"}, d.title),
        el("div", {className: "hint"}, `${dueMark(d.due, deadlineState.today)} · ${CATEGORIES()[d.category]}`));
      main.onclick = () => openDeadline(d);
      return el("div", {className: "row"}, main);
    }

    function hiddenRow(h) {
      const main = el("div", {className: "main faded"}, el("div", {className: "title"}, h.title),
        el("div", {className: "hint"}, `${dayLabel(h.due)} · ${SOURCES()[h.source] || h.source}`));
      const restore = el("button", {className: "small"}, L("Restore", "Вернуть"));
      restore.onclick = () => changeDeadlines("api/hidden/" + encodeURIComponent(h.uid), "DELETE");
      return el("div", {className: "row"}, main, restore);
    }

    function openDeadline(d) {
      openView("deadline");
      const fresh = !d;
      d = d || {title: "", due: deadlineState.today, category: "study"};
      const title = el("input", {value: d.title, maxLength: 200,
        placeholder: L("Sign up for a minor", "Записаться на майнор")});
      const due = el("input", {type: "date", value: d.due});
      const category = el("select", {disabled: !fresh}, el("option", {value: "study"}, CATEGORIES().study),
        el("option", {value: "personal"}, CATEGORIES().personal));
      category.value = d.category;
      const saveButton = el("button", {}, L("Save", "Сохранить"));
      saveButton.onclick = async () => {
        const ok = fresh ?
          await changeDeadlines("api/deadlines", "POST", {title: title.value, due: due.value, category: category.value}) :
          await changeDeadlines("api/deadlines/" + encodeURIComponent(d.uid), "PATCH",
            {title: title.value, due: due.value});
        if (ok) back();
      };
      const actions = el("div", {className: "actions"}, saveButton);
      if (!fresh) {
        const removeButton = el("button", {className: "danger"}, L("Delete", "Удалить"));
        removeButton.onclick = () => tg.showConfirm(L("Delete this own deadline?", "Удалить свой дедлайн?"),
          async (yes) => {
            if (yes && await changeDeadlines("api/deadlines/" + encodeURIComponent(d.uid), "DELETE")) back();
          });
        actions.append(removeButton);
      }
      $("deadline").replaceChildren(
        el("h2", {}, fresh ? L("Own deadline", "Свой дедлайн") : d.title),
        el("p", {className: "hint"}, L("Shown in Tablo, in HA's to-do list and in the pinned list of the «Deadlines» "
          + "topic. Deleted by itself 30 days after it is due.", "Виден в Tablo, в списке дел HA и в закрепе темы "
          + "«Дедлайны». Через 30 дней после срока удаляется сам.")),
        el("label", {className: "field"}, L("What to do", "Что сделать"), title),
        el("label", {className: "field"}, L("Due", "Срок"), due),
        el("label", {className: "field"}, L("List", "Список"), category),
        actions);
    }

        parts.push(el("div", {className: "card warn"}, L("The last summary: ", "Последняя сводка: ") + data.status.error));

      const okAt = data.status.ok_at;
      const done = okAt ? L(`The last one was made on ${okAt.slice(8, 10)}.${okAt.slice(5, 7)} at ${okAt.slice(11, 16)}.`,
        `Последняя собрана ${okAt.slice(8, 10)}.${okAt.slice(5, 7)} в ${okAt.slice(11, 16)}.`) : "";

          "Пока ни одного: включите «Сводку» в настройках чата.")));
      } else {
        parts.push(el("div", {className: "list"}, ...data.chats.map((item) => {
          const main = el("div", {className: "main"}, el("div", {className: "title"}, item.title));
          const chat = chats.find((c) => c.id === item.id);
          if (chat) main.onclick = () => openChat(chat);
          return el("div", {className: "row"}, main);
        })));
        parts.push(el("p", {className: "hint"}, L("To take a chat out of the summary, switch off «Summary» in its "

    async function loadSheets() {
      try {
        renderSheets(await call("api/sheets"));

        $("tab-sheets").replaceChildren(el("p", {className: "hint"}, error.message));

    async function changeSheets(path, method, values) {
      try {
        renderSheets(await send(path, method, values));

        loadSheets();

    function sheetTitle(sheet) {
      return (sheet.title || sheet.course || L("Sheet", "Листок"))
        + (sheet.number ? L(" · sheet ", " · листок ") + sheet.number : "");
    }

    function renderSheets(data) {
      const parts = [el("p", {className: "hint"}, L("PDFs with tasks from the chats: the bot posts them to the «Sheets» "
        + "topic. A new version replaces the file in the old message. A version that was not recognised can be "
        + "joined to the older sheet here.", "PDF с заданиями из чатов: бот присылает их в тему «Листочки». Новая "
        + "версия заменяет файл в старом сообщении. Если версию не узнали, её можно присоединить к старому листку "
        + "здесь."))];
      if (data.status.error) {
        parts.push(el("div", {className: "card warn"}, L("Reading a PDF failed: ", "Чтение PDF не удалось: ")
          + data.status.error));
      }
      if (data.status.waiting) {
        parts.push(el("div", {className: "card"}, L("Waiting for the forum: ", "Ждут отправки в форум: ")
          + data.status.waiting + "."));
      }
      parts.push(el("h3", {}, L("Reading a whole PDF", "Чтение PDF целиком")),
        el("p", {className: "hint"}, L("For chats with «Whole PDF»: how much of one file is read, whichever comes first.",
          "Для чатов с «PDF целиком»: сколько читать из одного файла, что наступит раньше.")),
        el("div", {className: "list"},
          settingRow(L("Pages", "Страниц"), "", limitInput(data.limits.pdf_pages, 1, 50, "pdf_pages")),
          settingRow(L("Tokens", "Токенов"), L("a scan is about 3000 a page", "скан — около 3000 на страницу"),
            limitInput(data.limits.pdf_tokens, 1000, 200000, "pdf_tokens"))));
      parts.push(el("h3", {}, L("Sheets · ", "Листочки · ") + data.sheets.length));
      if (!data.sheets.length) parts.push(el("p", {className: "hint"}, L("No sheets yet.", "Листочков пока нет.")));
      const older = data.sheets.filter((sheet) => sheet.status === "posted");
      for (const sheet of data.sheets) parts.push(sheetCard(sheet, older));
      $("tab-sheets").replaceChildren(...parts);
    }

    function limitInput(value, min, max, name) {
      const input = el("input", {type: "number", value, min, max, step: 1, inputMode: "numeric"});
      input.style.width = "90px";
      input.style.textAlign = "right";
      input.onchange = () => changeSheets("api/sheets", "PATCH", {[name]: Number(input.value)});
      return input;
    }

    function sheetCard(sheet, older) {
      const facts = [sheet.name];
      if (sheet.due) facts.push(L("due ", "срок ") + dayLabel(sheet.due));
      if (sheet.versions > 1) facts.push(L("versions: ", "версий: ") + sheet.versions);
      const where = [sheet.chat, sheet.created_at.slice(8, 10) + "." + sheet.created_at.slice(5, 7)];
      const main = el("div", {className: "main" + (sheet.status === "failed" ? " faded" : "")},
        el("div", {className: "title"}, sheetTitle(sheet)), el("div", {className: "hint"}, facts.join(" · ")),
        el("div", {className: "hint"}, where.filter(Boolean).join(" · ")));
      if (sheet.summary) main.append(el("div", {className: "hint"}, sheet.summary));
      if (sheet.status === "failed") {
        main.append(el("div", {className: "hint warn"}, L("Not posted: ", "Не отправлен: ") + sheet.error));
      }
      if (sheet.status === "new") {
        main.append(el("div", {className: "hint"}, L("Waiting for the forum.", "Ждёт отправки в форум.")));
      }
      const card = el("div", {className: "list"}, el("div", {className: "row"}, main));
      const others = older.filter((other) => other.first !== sheet.first && other.created_at <= sheet.created_at);
      if (sheet.status === "posted" && sheet.versions === 1 && sheet.file && others.length) {
        const select = el("select", {}, el("option", {value: ""}, L("no", "нет")),
          ...others.map((other) => el("option", {value: other.id},
            `${sheetTitle(other)} · ${other.name} · ${other.chat || ""}`)));
        select.onchange = () => {
          if (!select.value) return;
          const other = others.find((o) => String(o.id) === select.value);
          tg.showConfirm(L(`Is it a new version of «${sheetTitle(other)}»? The file replaces the old one in its `
            + "message, and this sheet's own message is deleted.", `Это новая версия «${sheetTitle(other)}»? Файл `
            + "заменит старый в его сообщении, а отдельное сообщение этого листка удалится."), (yes) => {
            if (yes) changeSheets(`api/sheets/${sheet.id}/join`, "POST", {previous: other.id});
            else select.value = "";
          });
        };
        card.append(settingRow(L("Update of a sheet", "Обновление листка"),
          L("if it is a new version of one posted before", "если это новая версия уже присланного"), select));
      }
      return card;
    }

    // --- grades ---------------------------------------------------------------

    let grades = null;
    const draft = {url: "", label: ""};  // the sheet being added: kept across renders

    async function loadGrades() {
      try {
        grades = await call("api/grades");
        renderGrades();
      } catch (error) {
        $("tab-grades").replaceChildren(el("p", {className: "hint"}, error.message));

        tg.showAlert(error.message);

    // The service reads the sheets at once after a change; their state comes a few seconds later.
    function rereadGrades() {
      setTimeout(() => { if (!$("tab-grades").hidden) loadGrades(); }, 5000);
    }

    function gradeMark(value) {
      const rounded = Math.round(value * 10) / 10;
      return Number.isInteger(rounded) ? String(rounded) : rounded.toFixed(1);
    }

    function sheetsOf(data) {
      return data.sheets.map((sheet) => ({url: sheet.url, label: sheet.label}));
    }

    function renderGrades() {
      const data = grades;
      const student = el("input", {value: data.student, placeholder: L("Surname Name", "Фамилия Имя")});
      student.style.width = "180px";
      student.style.textAlign = "right";
      student.onchange = () => {
        const value = student.value.trim();
        if (!data.student || !data.sheets.length) {
          changeGrades({student: value}).then((ok) => ok && rereadGrades());
          return;
        }
        tg.showConfirm(L("Change the name? The sheets are read anew: the first reading tells of no new grades.",
          "Сменить ФИО? Таблицы прочитаются заново: первое чтение — без сообщений о новых оценках."),
          (yes) => {
            if (yes) changeGrades({student: value}).then((ok) => ok && rereadGrades());
            else student.value = data.student;
          });
      };
      const windowDays = el("input", {type: "number", value: data.window_days, min: 1, max: 60, step: 1,
        inputMode: "numeric"});
      windowDays.style.width = "70px";
      windowDays.style.textAlign = "right";
      windowDays.onchange = () => changeGrades({window_days: Number(windowDays.value)});
      const parts = [el("p", {className: "hint"}, L("Teachers' Google Sheets open to anyone with the link. Every 30 "
        + "minutes the service finds the own row in them by the name; Haiku sees the top of a tab and that row and "
        + "finds the header itself. A new or changed grade comes to the «Grades» topic. The first reading of a sheet "
        + "is a snapshot, without messages.", "Таблицы преподавателей в Google, открытые по ссылке. Раз в 30 минут "
        + "сервис ищет в них свою строку по ФИО; Haiku видит верх вкладки и эту строку и сама находит шапку. Новая или "
        + "изменённая оценка приходит в тему «Оценки». Первое чтение таблицы — снимок, без сообщений."))];
      if (!data.llm) {
        parts.push(el("div", {className: "card warn"}, L("No Haiku key: the tabs are not marked up.",
          "Нет ключа Haiku: вкладки не размечаются.")));
      }
      parts.push(el("div", {className: "list"},
        settingRow(L("Name", "ФИО"), L("as in the sheets: «Иванов Иван» finds «ИВАНОВ Иван Петрович»",
          "как в таблицах: «Иванов Иван» найдёт «ИВАНОВ Иван Петрович»"), student),
        settingRow(L("A grade is new", "Оценка новая"), L("days: the API for Tablo gives it this long",
          "дней: столько её отдаёт API для Tablo"), windowDays)));
      parts.push(el("h3", {}, L("Sheets · ", "Таблицы · ") + data.sheets.length));
      if (!data.student && data.sheets.length) {
        parts.push(el("p", {className: "hint warn"}, L("Without the name the sheets are not read.",
          "Без ФИО таблицы не читаются.")));
      }
      for (const sheet of data.sheets) parts.push(gradeSheetCard(sheet, data));
      parts.push(addSheetCard(data));
      $("tab-grades").replaceChildren(...parts);
    }

    function gradeSheetCard(sheet, data) {
      const name = sheet.title || sheet.label || L("Sheet", "Таблица");
      const facts = [];
      if (sheet.label) facts.push(L("course ", "курс ") + sheet.label);
      if (sheet.ok_at) {
        facts.push(L(`tabs: ${sheet.tabs}, grades: ${sheet.items}, read ${when(sheet.ok_at)}`,
          `вкладок: ${sheet.tabs}, оценок: ${sheet.items}, прочитана ${when(sheet.ok_at)}`));
      } else if (!sheet.error) {
        facts.push(L("not read yet", "ещё не прочитана"));
      }
      const link = el("a", {href: sheet.url, target: "_blank"}, name);
      link.onclick = (event) => { event.preventDefault(); tg.openLink(sheet.url); };
      const main = el("div", {className: "main"}, el("div", {className: "title"}, link),
        el("div", {className: "hint"}, facts.join(" · ")));
      if (sheet.error) main.append(el("div", {className: "hint warn"}, L("Cannot be read: ", "Не читается: ") + sheet.error));
      if (sheet.unread && sheet.unread.length) {
        main.append(el("div", {className: "hint warn"}, L("Haiku could not mark up the tabs: ",
          "Haiku не смогла разметить вкладки: ") + sheet.unread.join(", ")
          + L(". They are skipped until their header changes.", ". Они пропускаются, пока у них не изменится шапка.")));
      }
      const remove = el("button", {className: "small"}, L("Remove", "Убрать"));
      remove.onclick = () => tg.showConfirm(L(`Remove «${name}»? Its grades are forgotten; added again, its first `
        + "reading is a snapshot.", `Убрать «${name}»? Её оценки забудутся; если добавить снова, первое чтение будет `
        + "снимком."), (yes) => {

      });
      const card = el("div", {className: "list"}, el("div", {className: "row"}, main, remove));
      for (const grade of sheet.grades) {
        const value = gradeMark(grade.value) + (grade.bonus ? ` ${grade.bonus > 0 ? "+" : ""}${grade.bonus}` : "");
        const points = grade.max !== 10 ? `${grade.raw} ${L("of", "из")} ${grade.max}` : "";

    // --- the dictionary -----------------------------------------------------

    async function loadSubjects() {
      try {
        dictionary = await call("api/subjects");
        renderSubjects();
      } catch (error) {
        $("subjects").replaceChildren(el("p", {className: "hint"}, error.message));
      }
    }

    function renderSubjects() {
      $("subjects-error").hidden = !dictionary.error;
      $("subjects-error").textContent = dictionary.error ? L("Haiku did not answer: ", "Haiku не ответила: ")
        + dictionary.error + L(". Until it does, the names are the sources'.", ". Пока названия — как у источника.") : "";
      const query = $("subject-search").value.trim().toLowerCase();
      const shown = dictionary.subjects.filter((s) =>
        [s.name, s.title, s.abbr].some((text) => text.toLowerCase().includes(query)));
      const rows = shown.map((subject) => {
        const main = el("div", {className: "main"}, el("div", {className: "title"}, subject.name),
          el("div", {className: "hint"}, `${subject.title} · ${subject.abbr}`));
        main.onclick = () => openSubject(subject);
        return el("div", {className: "row"}, main,
          el("span", {className: "badge"}, subject.manual ? L("manual", "вручную") : "Haiku"));
      });
      $("subjects").replaceChildren(rows.length ? el("div", {className: "list"}, ...rows) :
        el("p", {className: "hint"}, dictionary.subjects.length ? L("Nothing found.", "Ничего не нашлось.") :
          L("The dictionary is empty: courses come from RUZ and from the deadlines.",
            "Словарь пуст: курсы появятся из РУЗ и из дедлайнов.")));
    }

    function openSubject(subject) {
      openView("subject");
      const fresh = !subject;
      subject = subject || {name: "", title: "", abbr: "", manual: true};
      const name = el("input", {value: subject.name, readOnly: !fresh, placeholder: "Математический анализ"});
      const title = el("input", {value: subject.title, maxLength: 40, placeholder: "Calculus"});
      const abbr = el("input", {value: subject.abbr, maxLength: dictionary.abbr_chars, placeholder: "Calc"});
      const saveButton = el("button", {}, L("Save", "Сохранить"));
      saveButton.onclick = async () => {
        try {
          await send("api/subjects", "PUT", {name: name.value, title: title.value, abbr: abbr.value});
          await loadSubjects();
          back();
        } catch (error) {
          tg.showAlert(error.message);
        }
      };
      const actions = el("div", {className: "actions"}, saveButton);
      if (!fresh) {
        const removeButton = el("button", {className: "danger"}, L("Delete", "Удалить"));
        removeButton.onclick = () => tg.showConfirm(subject.manual
          ? L("Delete the entry? Haiku names the course again.", "Удалить запись? Haiku назовёт курс заново.")
          : L("Delete Haiku's answer? The course is named again.", "Удалить ответ Haiku? Курс будет назван заново."),
          async (yes) => {
            if (!yes) return;
            try {
              await send("api/subjects", "DELETE", {name: subject.name});
              await loadSubjects();
              back();
            } catch (error) {
              tg.showAlert(error.message);
            }
          });
        actions.append(removeButton);
      }
      $("subject").replaceChildren(
        el("h2", {}, fresh ? L("New entry", "Новая запись") : subject.name),
        el("p", {className: "hint"}, subject.manual ? L("The entry is set by hand.", "Запись задана вручную.") :
          L("Now it is Haiku's answer; saved, the entry becomes manual.",
            "Сейчас это ответ Haiku; после сохранения запись станет ручной.")),
        el("label", {className: "field"}, L("The name, as the source gives it", "Название, как у источника"), name),
        el("label", {className: "field"}, L(`In English, for the timetable (Tablo fits ${dictionary.title_chars})`,
          `По-английски, для расписания (в Tablo влезает ${dictionary.title_chars})`), title),
        el("label", {className: "field"}, L(`The abbreviation for deadlines, up to ${dictionary.abbr_chars} characters`,
          `Сокращение для дедлайнов, до ${dictionary.abbr_chars} символов`), abbr),
        actions);
    }

    // --- HSE App X ------------------------------------------------------------

    // Login links are made ahead: Telegram opens a link only right in a tap, not after a request. Each link holds
    // a PKCE state and the service keeps the last five, so links are made on opening the screen and after a tap,
    // never while the screen waits for the login to come back.
    const hse = {state: null, link: null, appLink: null, watch: null, note: null, fallback: false, pasted: ""};

    async function loadHseApp() {
      stopHseWatch();
      hse.link = hse.appLink = null;
      try {
        hse.state = await call("api/hseapp");
      } catch (error) {
        $("tab-hseapp").replaceChildren(el("p", {className: "hint"}, error.message));
        return;
      }
      renderHseApp();
      if (hse.state.status.enabled) prepareHseLinks();
    }

    // The link back to the service always, the one with the app's address once its section is open.
    async function prepareHseLinks() {
      try {
        if (!hse.link) hse.link = await hseLink(false);
        if (hse.fallback && !hse.appLink) hse.appLink = await hseLink(true);
      } catch (error) {
        hse.note = {ok: false, text: error.message};
      }
      renderHseApp();
    }

    async function hseLink(app) {
      return (await send("api/hseapp/link", "POST", {app})).url;
    }

    function stopHseWatch() {
      clearInterval(hse.watch);
      hse.watch = null;
    }

    // After a tap on a login link: the state every 3 s until the login is back from the browser, 5 minutes at most.
    function watchHseLogin() {
      stopHseWatch();
      const started = Date.now();
      hse.watch = setInterval(async () => {
        if (Date.now() - started > 5 * 60 * 1000 || $("tab-hseapp").hidden) return stopHseWatch();
        try {
          const state = await call("api/hseapp");
          const changed = JSON.stringify(state) !== JSON.stringify(hse.state);
          if (state.status.logged_in && changed) {
            stopHseWatch();
            if (!hse.state.status.logged_in) hse.note = {ok: true, text: loggedIn()};
          }
          hse.state = state;
          if (changed) renderHseApp();  // not on every tick: a half-pasted address must stay
        } catch (error) {
          stopHseWatch();
        }
      }, 3000);
    }

    const loggedIn = () => L("Logged in. The deadlines will be updated within a minute.",
                             "Вход выполнен. Дедлайны обновятся в течение минуты.");
    const LOGIN_ERROR = "login needed: ";  // the status error when the session ended (collectors/hseapp.py)

    function openHseLink(app) {
      tg.openLink(app ? hse.appLink : hse.link);
      if (app) hse.appLink = null; else hse.link = null;  // used: a fresh one for the next tap
      hse.note = {ok: true, text: L("The login is open in the browser. Come back here after it: the screen updates "
        + "by itself.", "Вход открыт в браузере. После него вернитесь сюда: экран обновится сам.")};
      watchHseLogin();
      prepareHseLinks();
    }

    async function changeHseApp(values) {
      hse.note = null;
      try {
        hse.state = await send("api/hseapp", "PATCH", values);
      } catch (error) {
        tg.showAlert(error.message);
      }
      renderHseApp();
      if (hse.state.status.enabled) prepareHseLinks();
    }

    function hseCards(s) {
      const cards = [];
      if (!s.enabled) {
        cards.push(el("div", {className: "card"}, L("Polling is off: the deadlines of HSE App X are not updated.",
          "Опрос выключен: дедлайны из HSE App X не обновляются.")));
      } else if (s.logged_in) {
        cards.push(el("div", {className: "card"}, L(`Logged in. Active deadlines: ${s.items}, done: ${s.done}`,
          `Вход выполнен. Активных дедлайнов: ${s.items}, выполненных: ${s.done}`)
          + (s.ok_at ? L(". Updated ", ". Обновлено ") + when(s.ok_at) + "." : L(". The poll is coming.",
            ". Опрос — вот-вот."))));
      }
      const ended = (s.error || "").startsWith(LOGIN_ERROR);  // Keycloak ended the session: said in the card below
      if (s.enabled && !s.logged_in) {
        const why = ended ? L(`The login is no longer valid (${s.error.slice(LOGIN_ERROR.length)}): the deadlines`,
          `Вход больше не действует (${s.error.slice(LOGIN_ERROR.length)}): дедлайны`)
          : L("A login is needed: without it the deadlines", "Нужен вход: без него дедлайны");
        cards.push(el("div", {className: "card warn"}, why + L(" of HSE App X are not updated",
          " из HSE App X не обновляются") + (s.items || s.done ? L(": the list has the last ones received.",
          " — в списке последнее полученное.") : ".")));
      }
      if (s.error && s.enabled && !ended) {
        cards.push(el("div", {className: "card warn"}, L("The last error: ", "Последняя ошибка: ") + s.error));
      }
      if (s.labels_error) {
        cards.push(el("div", {className: "card warn"}, L("The English titles wait for Haiku: ",
          "Английские названия ждут Haiku: ") + s.labels_error + L(". Until then new deadlines have Russian titles.",
          ". Пока у новых дедлайнов русские названия.")));
      }
      return cards;
    }

    function renderHseApp() {
      const s = hse.state.status;
      const parts = [el("p", {className: "hint"}, L("Deadlines from the HSE app. Log in once: after that the service "
        + "renews the login itself at every poll, every 15 minutes.", "Дедлайны из приложения ВШЭ. Войти нужно один "
        + "раз: дальше сервис сам продлевает вход при каждом опросе, раз в 15 минут.")), ...hseCards(s),
        el("div", {className: "list"}, settingRow(L("Poll HSE App X", "Опрашивать HSE App X"),
          L("one client per login: HSE App X must be off in Tablo",
            "только один клиент на вход: в Tablo HSE App X должен быть выключен"),
          toggle(s.enabled, (on) => changeHseApp({enabled: on}))))];
      if (s.enabled) {
        const login = el("button", {disabled: !hse.link}, s.logged_in ? L("Log in again", "Войти заново") :
          L("Log in", "Войти"));
        login.onclick = () => openHseLink(false);
        parts.push(el("div", {className: "actions"}, login));
      }
      if (hse.note) parts.push(el("p", {className: hse.note.ok ? "ok" : "warn"}, hse.note.text));
      if (s.enabled) parts.push(hseFallback());
      $("tab-hseapp").replaceChildren(...parts);
    }

    function hseFallback() {
      const box = el("details", {className: "card", open: hse.fallback},
        el("summary", {}, L("The browser did not come back", "Браузер не вернулся")));
      box.ontoggle = () => {
        if (box.open === hse.fallback) return;  // set by the render, not by a tap
        hse.fallback = box.open;
        if (box.open) prepareHseLinks();
      };
      const appLogin = el("button", {disabled: !hse.appLink}, L("Log in with the app's address",
        "Войти с адресом приложения"));
      appLogin.onclick = () => openHseLink(true);
      const pasted = el("textarea", {rows: 3, value: hse.pasted, autocomplete: "off", spellcheck: false,
        placeholder: "https://…/hseapp/callback?state=…&code=…"});
      pasted.oninput = () => { hse.pasted = pasted.value; };
      const saveLogin = el("button", {}, L("Save the login", "Сохранить вход"));
      saveLogin.onclick = async () => {
        try {
          hse.state = await send("api/hseapp/login", "POST", {url: hse.pasted});
          hse.note = {ok: true, text: loggedIn()};
          hse.pasted = "";
          hse.fallback = false;
          stopHseWatch();
        } catch (error) {
          hse.note = {ok: false, text: error.message};
        }
        renderHseApp();
      };
      box.append(
        el("p", {className: "hint"}, L(`After the login the browser comes back to ${hse.state.callback} by itself and `
          + "says «Logged in». If that page did not open, copy its whole address from the address bar (it has code= in "
          + "it) and paste it below within a minute.", `После входа браузер сам возвращается на ${hse.state.callback} `
          + "и пишет «Вход выполнен». Если эта страница не открылась, скопируйте её адрес из адресной строки целиком "
          + "(в нём есть code=) и вставьте ниже в течение минуты.")),
        el("p", {className: "hint"}, L("If HSE does not let you in with this address, log in with the app's address: "
          + "after the login the browser cannot open ru.hse.hseappx://…, and that address is the one to copy (Safari "
          + "loses it, Chrome is needed).", "Если ВШЭ не пускает с этим адресом, войдите с адресом приложения: после "
          + "входа браузер не сможет открыть ru.hse.hseappx://… — этот адрес и нужно скопировать (Safari его "
          + "теряет, нужен Chrome).")),
        el("div", {className: "actions"}, appLogin), pasted, el("div", {className: "actions"}, saveLogin));
      return box;
    }

    // --- the twin's account ----------------------------------------------------

    async function twinStep(path, values = {}) {
      try {
        const state = await send(path, "POST", values);
        renderTwin(state);
        if (state.account) {  // logged in: its chats are listed now
          chats = (await call("api/chats")).chats;
          $("search").hidden = chats.length < 8;
          renderList();
        }
      } catch (error) {
        tg.showAlert(error.message);
      }
    }

    function twinForm(label, input, button, cancel) {
      const go = el("button", {type: "submit"}, button);
      const form = el("form", {}, el("label", {className: "field"}, label, input), el("div", {className: "actions"}, go));
      if (cancel) {
        const stop = el("button", {type: "button", className: "danger"}, L("Cancel", "Отмена"));
        stop.onclick = () => twinStep("api/twin/cancel");
        form.lastChild.append(stop);
      }
      return form;
    }

    function renderTwin(t) {
      const box = $("twin");
      box.hidden = false;
      if (t.account) {
        const out = el("button", {className: "link"}, L("Log out", "Выйти"));
        out.onclick = () => tg.showConfirm(L("Log out of the twin's account? The chats stop being read, their settings "
          + "stay.", "Выйти из аккаунта твинка? Чаты перестанут читаться, их настройки останутся."),
          (yes) => { if (yes) twinStep("api/twin/logout"); });
        box.replaceChildren(el("div", {className: "row", style: "padding: 0"},
          el("div", {className: "main"}, el("div", {className: "title"}, L("Twin: ", "Твинк: ") + t.account.name
            + (t.account.username ? " (@" + t.account.username + ")" : "")),
            el("div", {className: t.error ? "hint warn" : "hint"}, t.error || L("reads the enabled chats",
              "читает включённые чаты"))),
          out));
        return;
      }
      let form;
      if (t.login && t.login.step === "code") {
        const code = el("input", {inputMode: "numeric", autocomplete: "one-time-code", placeholder: "12345"});
        form = twinForm(L(`The code from the twin's Telegram (${t.login.phone})`,
          `Код из Telegram твинка (${t.login.phone})`), code, L("Log in", "Войти"), true);
        form.onsubmit = (event) => { event.preventDefault(); twinStep("api/twin/login", {code: code.value}); };
        box.replaceChildren(el("p", {className: "hint"}, L("The code comes to the twin's Telegram or by SMS. Do not "
          + "forward it in Telegram: then it stops working.", "Код приходит в Telegram твинка или по SMS. Не "
          + "пересылайте его в Telegram: тогда он перестаёт действовать.")), form);
      } else if (t.login && t.login.step === "password") {
        const password = el("input", {type: "password", autocomplete: "current-password"});
        form = twinForm(L("The twin's cloud password", "Облачный пароль твинка"), password, L("Log in", "Войти"), true);
        form.onsubmit = (event) => { event.preventDefault(); twinStep("api/twin/login", {password: password.value}); };
        box.replaceChildren(form);
      } else {
        const phone = el("input", {type: "tel", autocomplete: "tel", placeholder: "+7…"});
        form = twinForm(L("The twin's phone", "Телефон твинка"), phone, L("Get a code", "Получить код"), false);
        form.onsubmit = (event) => { event.preventDefault(); twinStep("api/twin/login", {phone: phone.value}); };
        box.replaceChildren(el("div", {className: "warn"}, L("The twin reads no chats: ", "Твинк не читает чаты: ")
          + (t.error || L("a login is needed", "нужен вход")) + "."),
          el("p", {className: "hint"}, L("A Telegram account of its own, not your main one and not a bot.",
            "Отдельный аккаунт Telegram, не ваш основной и не бот.")), form);
      }
    }

    // The languages (р. 41): the Mini App's is drawn anew at once, the forum's applies to what the bot says next.
    function languageSelect(value, onchange) {
      const select = el("select", {}, ...Object.entries(LANGUAGE_NAMES).map(([code, name]) =>

    function renderGeneral(data) {
      const every = el("select", {}, ...data.batch_choices.map((n) =>
        el("option", {value: n, selected: n === data.batch_hours}, L(`${n} h`, `${n} ч`))));
      every.onchange = () => changeGeneral({batch_hours: Number(every.value)});
      const ttl = el("input", {type: "number", min: 1, max: 168, step: 1, value: data.news_ttl_hours});
      ttl.onchange = () => changeGeneral({news_ttl_hours: Number(ttl.value)});
      const parts = [el("p", {className: "hint"}, L("The other settings are on their own screens: chats, LLM spending, "
        + "sheets, summaries, grades, HSE App X. The secrets (tokens, the mail password, the RUZ link) are in .env on "
        + "the server.", "Остальные настройки — на своих экранах: чаты, расход LLM, листочки, сводки, оценки, HSE App X. "
        + "Секреты (токены, пароль почты, ссылка РУЗ) — в .env на сервере.")),
        el("div", {className: "list"},
          settingRow(L("Batch parsing", "Разбор пачек"), L("every N hours, at the hours of the day divisible by N; a "
            + "chat may have its own", "каждые N часов, в часы суток, кратные N; у чата может быть свой"), every),
          settingRow(L("News lives, h", "Новости живут, ч"), L("in the forum and in Tablo; non-study messages older "
            + "than this are parsed without the model", "в форуме и в Tablo; неучебное старше этого разбирается без "
            + "модели"), ttl)),
        el("h3", {}, L("Language", "Язык")),
        el("div", {className: "list"},
          settingRow("Mini App", L("this app and the HSE App X login page", "это приложение и страница входа HSE App X"),
            languageSelect(data.miniapp_language, changeLanguage)),
          settingRow(L("Forum", "Форум"), L("the bot's messages, buttons and answers, the summaries and the sheets' "
            + "descriptions; news and deadline titles stay English, as Tablo gets them", "сообщения, кнопки и ответы "
            + "бота, сводки и описания листочков; новости и названия дедлайнов остаются английскими, как в Tablo"),
            languageSelect(data.forum_language, (value) => changeGeneral({forum_language: value}))))];
      for (const [model, price] of Object.entries(data.llm_prices)) {
        parts.push(el("h3", {}, L(`${model} · $ per 1M tokens`, `${model} · $ за 1 млн токенов`)));
        parts.push(el("div", {className: "list"}, ...PRICE_FIELDS().map(([key, title]) => {
          const input = el("input", {type: "number", min: 0, step: 0.01, value: price[key]});
          input.onchange = () => changeGeneral({llm_prices: {...data.llm_prices,
                                                             [model]: {...price, [key]: Number(input.value)}}});
          return settingRow(title, "", input);
        })));
      }
      $("tab-general").replaceChildren(...parts);
    }

    // --- LLM spending ---------------------------------------------------------

    const TASKS = () => L({batch: "Batch parsing", image: "Images", pdf: "Whole PDF", summary: "Summaries",
                           subjects: "Dictionary", grades: "Grades", hseapp_labels: "HSE App X labels"},
                          {batch: "Разбор пачек", image: "Картинки", pdf: "PDF целиком", summary: "Сводки",
                           subjects: "Словарь", grades: "Оценки", hseapp_labels: "Метки HSE App X"});
    const PERIODS = () => [["today", L("Today", "Сегодня")], ["week", L("Week", "Неделя")],
                           ["month", L("Month", "Месяц")]];
    const llmView = {data: null, period: "today", day: null};
    const SVG = "http://www.w3.org/2000/svg";

    function usd(value) {
      return "$" + (value >= 10 ? value.toFixed(0) : value >= 0.1 || !value ? value.toFixed(2) : value.toFixed(3));
    }

    function runs(n) {
      if (lang !== "ru") return `${n} call${n === 1 ? "" : "s"}`;
      const last = n % 10, tens = n % 100;
      const word = last === 1 && tens !== 11 ? "вызов"
        : last >= 2 && last <= 4 && (tens < 12 || tens > 14) ? "вызова" : "вызовов";
      return `${n} ${word}`;
    }

    function shortDay(iso) {
      const date = new Date(iso + "T12:00:00");
      return `${WEEKDAYS()[date.getDay()]} ${iso.slice(8, 10)}.${iso.slice(5, 7)}`;
    }

    async function loadLlm() {
      try {
        renderLlm(await call("api/llm"));
      } catch (error) {
        $("tab-llm").replaceChildren(el("p", {className: "hint"}, error.message));
      }
    }

    async function changeLlm(path, method, values) {
      try {
        renderLlm(await send(path, method, values));
      } catch (error) {
        tg.showAlert(error.message);
        loadLlm();
      }
    }

    function svg(tag, attrs) {
      const node = document.createElementNS(SVG, tag);
      for (const [key, value] of Object.entries(attrs)) node.setAttribute(key, value);
      return node;
    }

    function chart(data) {
      const width = 300, height = 120, top = 8, bottom = 16, step = width / data.days.length;
      const peak = Math.max(data.daily_limit_usd, ...data.days.map((d) => d.cost_usd)) * 1.1;
      const y = (value) => top + (height - top - bottom) * (1 - value / peak);
      const picture = svg("svg", {viewBox: `0 0 ${width} ${height}`, class: "chart", preserveAspectRatio: "none"});
      const last = data.days.length - 1;
      data.days.forEach((day, i) => {
        const classes = ["bar", i === last ? "today" : "", day.stopped ? "stopped" : "",
                         day.day === llmView.day ? "picked" : ""].filter(Boolean).join(" ");
        const bar = Math.max(day.cost_usd ? 1.5 : 0, y(0) - y(day.cost_usd));
        picture.append(svg("rect", {class: classes, x: i * step + 1, y: y(0) - bar, width: step - 2, height: bar,
                                    rx: 1.5}));
        const tap = svg("rect", {class: "tap", x: i * step, y: 0, width: step, height});
        tap.onclick = () => { llmView.day = llmView.day === day.day ? null : day.day; renderLlm(data); };
        picture.append(tap);
      });
      picture.append(svg("line", {class: "limit", x1: 0, x2: width, y1: y(data.daily_limit_usd),
                                  y2: y(data.daily_limit_usd)}));
      for (const i of [0, Math.floor(last / 2), last]) {
        const label = svg("text", {x: i * step + step / 2, y: height - 3, "font-size": 9, fill: "currentColor",
                                   opacity: .6, "text-anchor": i === 0 ? "start" : i === last ? "end" : "middle"});
        label.textContent = i === last ? L("today", "сегодня")
          : data.days[i].day.slice(8, 10) + "." + data.days[i].day.slice(5, 7);
        picture.append(label);
      }
      return picture;
    }

    function costRow(title, hint, cost, total) {
      const share = total ? Math.round(cost / total * 100) : 0;
      return el("div", {className: "row"},
        el("div", {className: "main"}, el("div", {className: "title"}, title),
          el("div", {className: "hint"}, hint),
          el("div", {className: "share"}, el("i", {style: `width: ${share}%`}))),
        el("div", {className: "money"}, usd(cost), el("div", {className: "hint"}, share + " %")));
    }

    function showLlmLine(spent, limit, count) {
      $("llm").replaceChildren(el("span", {}, L(`LLM today: ${usd(spent)} of ${usd(limit)}, ${runs(count)}`,
        `LLM сегодня: ${usd(spent)} из ${usd(limit)}, ${runs(count)}`)), el("span", {className: "hint"}, "›"));
    }

    function renderLlm(data) {
      llmView.data = data;
      showLlmLine(data.spent_usd, data.limit_usd, data.periods.today.runs);
      const period = data.periods[llmView.period];
      const parts = [el("p", {className: "hint"}, L("Every call of Haiku, the failed ones too. A day is Moscow's, a "
        + "week starts on Monday. Above 80 % of the limit images, whole PDFs and the daily summary are off; at 100 % "
        + "calls wait until midnight.", "Все вызовы Haiku, неудачные тоже. Сутки — по Москве, неделя с понедельника. "
        + "Выше 80 % лимита отключаются картинки, PDF целиком и ежедневная сводка; на 100 % вызовы стоят до "
        + "полуночи."))];
      if (data.level !== "ok") {
        parts.push(el("div", {className: "card warn"}, data.level === "hard"
          ? L("Today's limit is spent: calls wait until midnight, messages wait in the queue.",
            "Лимит на сегодня исчерпан: вызовы стоят до полуночи, сообщения ждут в очереди.")
          : L("Over 80 % of the limit: images, whole PDFs and the daily summary are off until midnight.",
            "Больше 80 % лимита: картинки, PDF целиком и ежедневная сводка отключены до полуночи.")));
      }
      const share = Math.round(data.spent_usd / data.limit_usd * 100);
      const subtitles = {today: L(`${share} % of the limit`, `${share} % лимита`), week: runs(data.periods.week.runs),
                         month: L("forecast ", "прогноз ") + usd(data.month_forecast_usd)};
      parts.push(el("div", {className: "periods"}, ...PERIODS().map(([name, title]) => {
        const button = el("button", {className: name === llmView.period ? "on" : ""},
          el("div", {className: "hint"}, title), el("div", {className: "sum"}, usd(data.periods[name].cost_usd)),
          el("div", {className: "hint"}, subtitles[name]));
        button.onclick = () => { llmView.period = name; renderLlm(data); };
        return button;
      })));

      parts.push(el("h3", {}, L(`${data.days.length} days`, `${data.days.length} дней`)));
      parts.push(el("div", {className: "card"}, chart(data), el("div", {className: "hint"}, (() => {
        const day = data.days.find((d) => d.day === llmView.day);
        if (!day) {
          return L(`The dashes are the limit, ${usd(data.daily_limit_usd)} a day; red days hit the limit. Tap a bar.`,
            `Пунктир — лимит ${usd(data.daily_limit_usd)} в день, красные дни упёрлись в лимит. Нажмите на столбик.`);
        }
        return `${shortDay(day.day)}: ${usd(day.cost_usd)}, ${runs(day.runs)}`
          + (day.failed ? L(`, failed ${day.failed}`, `, неудачных ${day.failed}`) : "")
          + (day.stopped ? L(", the limit was spent", ", лимит исчерпан") : "");
      })())));

      const title = PERIODS().find(([name]) => name === llmView.period)[1].toLowerCase();
      parts.push(el("h3", {}, L("By task · ", "По задачам · ") + title));
      if (!period.runs) {
        parts.push(el("p", {className: "hint"}, L("No calls.", "Вызовов не было.")));
      } else {
        parts.push(el("div", {className: "list"}, ...period.by_task.map((row) => costRow(TASKS()[row.task] || row.task,
          runs(row.runs) + (row.failed ? L(`, failed ${row.failed}`, `, неудачных ${row.failed}`) : ""), row.cost_usd,
          period.cost_usd))));
        parts.push(el("h3", {}, L("By chat · ", "По чатам · ") + title));
        const chatted = period.by_chat.reduce((sum, row) => sum + row.cost_usd, 0);
        const rows = period.by_chat.map((row) => costRow(row.title, runs(row.runs), row.cost_usd, period.cost_usd));
        if (period.cost_usd - chatted > 0.0005) {
          rows.push(costRow(L("No chat", "Без чата"), L("dictionary, grades, HSE App X labels",
            "словарь, оценки, метки HSE App X"), period.cost_usd - chatted, period.cost_usd));
        }
        parts.push(el("div", {className: "list"}, ...rows));
      }

      parts.push(el("h3", {}, L("Limit", "Лимит")));
      const limit = el("input", {type: "number", min: 0.05, step: 0.05, value: data.daily_limit_usd});
      limit.onchange = () => changeLlm("api/llm", "PATCH", {daily_limit_usd: Number(limit.value)});
      const raise = el("button", {className: "link"}, `+${usd(data.daily_limit_usd)}`);
      const raised = usd(data.limit_usd + data.daily_limit_usd);
      raise.onclick = () => tg.showConfirm(L(`Raise today's limit to ${raised}?`, `Поднять лимит на сегодня до ${raised}?`),
        (yes) => { if (yes) changeLlm("api/llm/raise", "POST", {}); });
      parts.push(el("div", {className: "list"},
        settingRow(L("A day, $", "В день, $"), L("every Moscow day", "каждые сутки по Москве"), limit),
        settingRow(L("Raise for today", "Поднять на сегодня"), data.raised_usd
          ? L(`raised by ${usd(data.raised_usd)} today already, until midnight`,
            `сегодня уже поднят на ${usd(data.raised_usd)}, до полуночи`)
          : L("until midnight, like the button in «System»", "до полуночи, как кнопка в «Системе»"),
          raise)));
      $("tab-llm").replaceChildren(...parts);
    }

    // --- start ----------------------------------------------------------------

    function showTab(name) {
      for (const button of $("tabs").querySelectorAll("button")) {
        button.classList.toggle("on", button.dataset.tab === name);
        $("tab-" + button.dataset.tab).hidden = button.dataset.tab !== name;
      }
      if (name !== "hseapp") stopHseWatch();
      if (name === "schedule") loadSchedule();
      if (name === "deadlines") loadDeadlines();
      if (name === "sheets") loadSheets();
      if (name === "grades") loadGrades();
      if (name === "summaries") loadSummaries();
      if (name === "subjects") loadSubjects();
      if (name === "hseapp") { hse.note = null; loadHseApp(); }
      if (name === "llm") loadLlm();
      if (name === "general") loadGeneral();
    }

    // A screen asked for by the link the Mini App was opened with (a button under a post in the forum).
    const startScreen = new URLSearchParams(location.search).get("screen") || tg.initDataUnsafe.start_param;

    tg.BackButton.onClick(back);
    $("search").oninput = renderList;
    $("subject-search").oninput = renderSubjects;
    $("subject-add").onclick = () => openSubject(null);
    $("llm").onclick = () => showTab("llm");

    // The home screen and the screen to show, again after the Mini App's language changed.
    function start(screen) {
      return Promise.all([call("api/me"), call("api/chats")])
        .then(([me, list]) => {
          lang = me.language;
          applyLanguage();
          $("title").textContent = L("Hi, ", "Привет, ") + me.first_name;
          $("state").hidden = true;
          showLlmLine(me.llm.spent_usd, me.llm.limit_usd, me.llm.runs_today);
          $("llm").hidden = false;
          $("tabs").hidden = false;
          renderTwin(list.twin);
          const mail = list.mail || {};
          if (mail.configured) {  // collectors/mail.py: letters are read with the chats
            $("mail").textContent = mail.error ? L("The mail is not read: ", "Почта не читается: ") + mail.error + "."
              : L("Mail: letters of 14 days: ", "Почта: писем за 14 дней — ") + mail.letters
                + (mail.ok_at ? L(", checked ", ", проверена ") + mail.ok_at.slice(11, 16) : "");
            $("mail").classList.toggle("warn", Boolean(mail.error));
            $("mail").hidden = false;
          }
          chats = list.chats;
          $("search").hidden = chats.length < 8;
          renderList();
          renderImages(list.images);
          showTab(screen && $("tab-" + screen) ? screen : "chats");
        })
        .catch((error) => { $("state").hidden = false; $("state").textContent = error.message; });
    }

    start(startScreen);
  </script>
</body>
</html>
